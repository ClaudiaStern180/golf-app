<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="theme-color" content="#060e08"/>
  <title>GolfTracker</title>
  <link rel="manifest" href="manifest.json"/>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;}
    html,body,#root{margin:0;padding:0;height:100%;background:#060e08;}
    body{font-family:'DM Sans',system-ui,sans-serif;color:#ecfdf5;}
    ::-webkit-scrollbar{width:3px;}::-webkit-scrollbar-thumb{background:#166534;border-radius:2px;}
    .gi{background:#060e08;color:#ecfdf5;border:1px solid #2d4d38;border-radius:10px;padding:10px 14px;font-size:14px;width:100%;outline:none;transition:border .2s;}
    .gi:focus{border-color:#4ade80;}
    .gi[type=number]{-moz-appearance:textfield;}
    .gi::-webkit-outer-spin-button,.gi::-webkit-inner-spin-button{-webkit-appearance:none;}
    .gb{border:none;cursor:pointer;font-weight:500;border-radius:10px;transition:all .18s;}
    .gb:active{transform:scale(.96);}
    .tg{cursor:pointer;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:500;border:1px solid #2d4d38;background:transparent;color:#6b9e7a;transition:all .18s;}
    .tg.on{background:#22c55e22;border-color:#4ade80;color:#4ade80;}
    .tg.no{background:rgba(248,113,113,.1);border-color:#f87171;color:#f87171;}
    .card{background:#0b1e10;border:1px solid #173320;border-radius:16px;padding:18px;}
    @keyframes fi{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
    .fade{animation:fi .3s ease both;}
    @keyframes spin{to{transform:rotate(360deg);}}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">

// ═══════════════════════════════════════════════
// ⚙️  KONFIGURATION — hier deine Supabase-Daten!
// ═══════════════════════════════════════════════
const SUPABASE_URL  = "https://dcpijdxzwbseoirhizki.supabase.co";
const SUPABASE_KEY  = "sb_publishable_yiGYBc9S63g3Nmrxl2vBcw_z65-GUSF";
// ═══════════════════════════════════════════════

// Support both old (eyJ) and new (sb_publishable_) Supabase key formats
let sb;
try {
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: {
      autoRefreshToken: true,
      persistSession: true,
      detectSessionInUrl: true
    }
  });
} catch(e) {
  console.error("Supabase init error:", e);
}
const {useState,useEffect,useRef} = React;
// Safe Recharts import
const RC = typeof Recharts !== 'undefined' ? Recharts : {};
const LineChart = RC.LineChart || (()=>null);
const Line = RC.Line || (()=>null);
const BarChart = RC.BarChart || (()=>null);
const Bar = RC.Bar || (()=>null);
const XAxis = RC.XAxis || (()=>null);
const YAxis = RC.YAxis || (()=>null);
const CartesianGrid = RC.CartesianGrid || (()=>null);
const Tooltip = RC.Tooltip || (()=>null);
const ResponsiveContainer = RC.ResponsiveContainer || (({children})=>React.createElement('div',{style:{width:'100%',height:200}},children));
const Legend = RC.Legend || (()=>null);
const RadarChart = RC.RadarChart || (()=>null);
const Radar = RC.Radar || (()=>null);
const PolarGrid = RC.PolarGrid || (()=>null);
const PolarAngleAxis = RC.PolarAngleAxis || (()=>null);

// ── Theme ──
const T={bg:"#060e08",card:"#0b1e10",border:"#173320",accent:"#4ade80",
  accentDim:"#166534",accentGlow:"#22c55e22",text:"#ecfdf5",muted:"#6b9e7a",
  faint:"#2d4d38",red:"#f87171",yellow:"#fbbf24",blue:"#60a5fa",orange:"#fb923c",gold:"#fde68a"};
const TEE={
  yellow:{label:"Gelb",  short:"Gelb",  bg:"#fbbf24",fg:"#0f172a"},
  green: {label:"Grün",  short:"Grün",  bg:"#4ade80",fg:"#0f172a"},
  blue:  {label:"Blau",  short:"Blau",  bg:"#60a5fa",fg:"#fff"},
  red:   {label:"Rot",   short:"Rot",   bg:"#f87171",fg:"#fff"},
  orange:{label:"Orange",short:"Orange",bg:"#fb923c",fg:"#fff"},
};

// ── Golf Math ──
const genId=()=>Math.random().toString(36).slice(2,9);
const calcCHcp=(idx,sr,cr,par)=>Math.round(idx*(sr/113)+(cr-par));
const strokesOnHole=(chcp,si)=>chcp>=0?Math.floor(chcp/18)+(si<=chcp%18?1:0):(si<=Math.abs(chcp)?-1:0);
const sfNet=(g,par,st)=>g?Math.max(0,2+par+st-g):0;
const sfBrut=(g,par)=>g?Math.max(0,2+par-g):0;
const TeeChip=({t})=>{const c=TEE[t]||TEE.yellow;return <span style={{background:c.bg,color:c.fg,borderRadius:6,padding:"2px 8px",fontSize:11,fontWeight:600}}>{c.short}</span>;};
const Hdr=({title,sub})=><div style={{marginBottom:18}}><div style={{fontFamily:"Georgia,serif",fontSize:26,fontWeight:700}}>{title}</div>{sub&&<div style={{fontSize:12,color:T.muted,marginTop:2}}>{sub}</div>}</div>;
const Tog=({val,onT,onF})=><div style={{display:"flex",gap:6}}><button className={"tg"+(val===true?" on":"")} onClick={onT}>✓ Ja</button><button className={"tg"+(val===false?" no":"")} onClick={onF}>✗ Nein</button></div>;
const Row=({label,children})=><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"5px 0",borderTop:`1px solid ${T.faint}`}}><div style={{fontSize:12,color:T.muted}}>{label}</div>{children}</div>;
const Spin=()=><div style={{display:"flex",justifyContent:"center",alignItems:"center",padding:40}}><span style={{fontSize:32,display:"inline-block",animation:"spin 1s linear infinite"}}>⛳</span></div>;

// ── Supabase helpers ──
const DB={
  async getRounds(uid){const{data}=await sb.from("rounds").select("*").eq("user_id",uid).order("date",{ascending:false});return data||[];},
  async saveRound(uid,r){await sb.from("rounds").insert({user_id:uid,date:r.date,course_id:r.courseId,course_name:r.courseName,tee_type:r.teeType,num_holes:r.numHoles,cr:r.cr,sr:r.sr,par:r.par,hcp_index:r.hcpIndex,course_hcp:r.courseHcp,players:r.players,scores:r.scores,totals:r.totals});},
  async getSavedPlayers(uid){const{data}=await sb.from("saved_players").select("*").eq("owner_id",uid).order("name");return(data||[]).map(p=>({id:p.id,name:p.name,hcpIndex:p.hcp_index}));},
  async addPlayer(uid,p){const{data}=await sb.from("saved_players").insert({owner_id:uid,name:p.name,hcp_index:p.hcpIndex}).select().single();return{id:data.id,name:data.name,hcpIndex:data.hcp_index};},
  async updatePlayer(id,hcp){await sb.from("saved_players").update({hcp_index:hcp}).eq("id",id);},
  async deletePlayer(id){await sb.from("saved_players").delete().eq("id",id);},
  async getCourses(){const{data}=await sb.from("courses").select("*").order("name");return(data||[]).map(c=>({...c,tees:c.tees||{},holes:c.holes||[]}));},
  async addCourse(uid,c){await sb.from("courses").insert({id:c.id,name:c.name,location:c.location,tees:c.tees,holes:c.holes,is_preset:false,created_by:uid});},
  async deleteCourse(id){await sb.from("courses").delete().eq("id",id);},
  async updateCourse(id,d){await sb.from("courses").update(d).eq("id",id);},
  async getProfile(uid){const{data}=await sb.from("profiles").select("*").eq("id",uid).single();return data;},
  async updateProfile(uid,d){await sb.from("profiles").update(d).eq("id",uid);},
  // Admin
  async getAllProfiles(){const{data}=await sb.from("profiles").select("*").order("display_name");return data||[];},
  async getAllRounds(){const{data}=await sb.from("rounds").select("*").order("date",{ascending:false});return data||[];},
  async getUserRounds(uid){const{data}=await sb.from("rounds").select("*").eq("user_id",uid).order("date",{ascending:false});return data||[];},
};

// ══════════════════════════════════════════════
// AUTH SCREEN
// ══════════════════════════════════════════════
function AuthScreen({onLogin}){
  const[mode,setMode]=useState("login");
  const[name,setName]=useState("");
  const[email,setEmail]=useState("");
  const[pin,setPin]=useState("");
  const[err,setErr]=useState("");
  const[loading,setLoading]=useState(false);

  const submit=async()=>{
    setErr("");setLoading(true);
    try{
      if(mode==="register"){
        if(!name.trim()||!email.trim()||pin.length<4){setErr("Bitte alle Felder ausfüllen (PIN min. 4 Zeichen)");setLoading(false);return;}
        const{data,error}=await sb.auth.signUp({email,password:pin,options:{data:{display_name:name.trim()}}});
        if(error)throw error;
        if(data.user)onLogin(data.user);
        else setErr("Bitte E-Mail bestätigen und dann einloggen.");
      }else{
        const{data,error}=await sb.auth.signInWithPassword({email,password:pin});
        if(error)throw error;
        onLogin(data.user);
      }
    }catch(e){setErr(e.message||"Fehler beim Einloggen");}
    setLoading(false);
  };

  return(
    <div style={{minHeight:"100vh",background:T.bg,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{width:"100%",maxWidth:380}}>
        <div style={{textAlign:"center",marginBottom:32}}>
          <div style={{fontSize:56,marginBottom:8}}>⛳</div>
          <div style={{fontFamily:"Georgia,serif",fontSize:32,fontWeight:700}}>Golf<span style={{color:T.accent}}>Tracker</span></div>
          <div style={{fontSize:13,color:T.muted,marginTop:4}}>Dein persönlicher Golf-Assistent</div>
        </div>
        <div className="card" style={{padding:24}}>
          <div style={{display:"flex",gap:8,marginBottom:20}}>
            {["login","register"].map(m=><button key={m} className="gb" onClick={()=>{setMode(m);setErr("");}}
              style={{flex:1,padding:"10px",background:mode===m?T.accent:T.faint,color:mode===m?"#000":T.muted,border:`1px solid ${mode===m?T.accent:T.border}`,fontSize:13,fontWeight:600}}>
              {m==="login"?"Einloggen":"Registrieren"}
            </button>)}
          </div>
          <div style={{display:"grid",gap:12}}>
            {mode==="register"&&<label style={{fontSize:12,color:T.muted}}>Name
              <input className="gi" style={{marginTop:4}} value={name} onChange={e=>setName(e.target.value)} placeholder="Vorname Nachname"/>
            </label>}
            <label style={{fontSize:12,color:T.muted}}>E-Mail
              <input className="gi" type="email" style={{marginTop:4}} value={email} onChange={e=>setEmail(e.target.value)} placeholder="deine@email.de"/>
            </label>
            <label style={{fontSize:12,color:T.muted}}>PIN / Passwort (min. 4 Zeichen)
              <input className="gi" type="password" style={{marginTop:4}} value={pin} onChange={e=>setPin(e.target.value)} placeholder="••••••" onKeyDown={e=>e.key==="Enter"&&submit()}/>
            </label>
          </div>
          {err&&<div style={{background:"rgba(248,113,113,.1)",border:`1px solid ${T.red}`,borderRadius:8,padding:10,marginTop:12,fontSize:12,color:T.red}}>⚠️ {err}</div>}
          <button className="gb" onClick={submit} disabled={loading}
            style={{width:"100%",marginTop:16,background:T.accent,color:"#000",padding:"14px",fontSize:14,fontWeight:600,opacity:loading?0.6:1}}>
            {loading?"...":(mode==="login"?"Einloggen →":"Konto erstellen →")}
          </button>
          {mode==="login"&&<div style={{fontSize:11,color:T.muted,textAlign:"center",marginTop:10}}>
            Noch kein Konto? <span style={{color:T.accent,cursor:"pointer"}} onClick={()=>setMode("register")}>Jetzt registrieren</span>
          </div>}
        </div>
        <div style={{fontSize:11,color:T.muted,textAlign:"center",marginTop:16,lineHeight:1.6}}>
          Deine Daten werden sicher in der Cloud gespeichert.<br/>Von jedem Gerät zugänglich.
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════
// MAIN APP
// ══════════════════════════════════════════════
function App(){
  const[user,setUser]=useState(null);
  const[profile,setProfile]=useState(null);
  const[tab,setTab]=useState("home");
  const[courses,setCourses]=useState([]);
  const[rounds,setRounds]=useState([]);
  const[savedPlayers,setSavedPlayers]=useState([]);
  const[activeRound,setActiveRound]=useState(null);
  const[loading,setLoading]=useState(true);

  useEffect(()=>{
    sb.auth.getSession().then(({data:{session}})=>{
      if(session?.user){initUser(session.user);}else{setLoading(false);}
    });
    const{data:{subscription}}=sb.auth.onAuthStateChange((_,session)=>{
      if(session?.user)initUser(session.user);else{setUser(null);setProfile(null);setLoading(false);}
    });
    return()=>subscription.unsubscribe();
  },[]);

  const initUser=async(u)=>{
    setUser(u);
    const[prof,rds,sps,crs]=await Promise.all([DB.getProfile(u.id),DB.getRounds(u.id),DB.getSavedPlayers(u.id),DB.getCourses()]);
    setProfile(prof);setRounds(rds);setSavedPlayers(sps);setCourses(crs);
    const ar=localStorage.getItem("gf_ar_"+u.id);
    if(ar){setActiveRound(JSON.parse(ar));setTab("round");}
    setLoading(false);
  };

  const updAR=ar=>{setActiveRound(ar);if(ar)localStorage.setItem("gf_ar_"+user.id,JSON.stringify(ar));else localStorage.removeItem("gf_ar_"+user.id);};
  const updRounds=async r=>{setRounds(r);};
  const saveNewRound=async r=>{await DB.saveRound(user.id,r);const fresh=await DB.getRounds(user.id);setRounds(fresh);};
  const updSavedPlayers=sp=>setSavedPlayers(sp);
  const updCourses=c=>setCourses(c);

  if(loading)return<div style={{height:"100vh",background:T.bg,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:16,padding:20}}>
    <span style={{fontSize:48,display:"inline-block",animation:"spin 1.2s linear infinite"}}>⛳</span>
    <span style={{fontSize:13,color:T.muted,textAlign:"center"}}>Verbinde mit Datenbank…</span>
  </div>;
  if(!user)return<AuthScreen onLogin={u=>initUser(u)}/>;

  return(
    <div style={{fontFamily:"system-ui,sans-serif",color:T.text,background:T.bg,maxWidth:480,margin:"0 auto",minHeight:"100vh",paddingBottom:76}}>
      {tab==="home"    &&<HomeView rounds={rounds} profile={profile} setTab={setTab} activeRound={activeRound} user={user} updProfile={async d=>{await DB.updateProfile(user.id,d);setProfile({...profile,...d});}}/>}
      {tab==="courses" &&<CoursesView courses={courses} setCourses={updCourses} userId={user.id} isAdmin={!!profile?.is_admin}/>}
      {tab==="round"   &&<RoundView courses={courses} activeRound={activeRound} setActiveRound={updAR} rounds={rounds} saveNewRound={saveNewRound} setTab={setTab} savedPlayers={savedPlayers} updSavedPlayers={updSavedPlayers} userId={user.id}/>}
      {tab==="stats"   &&<StatsView rounds={rounds}/>}
      {tab==="admin"   &&profile?.is_admin&&<AdminView/>}
      <nav style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:480,background:"#040b06",borderTop:`1px solid ${T.border}`,display:"flex",zIndex:200}}>
        {[["home","🏠","Home"],["courses","🗺️","Plätze"],["round","⛳",activeRound?"Aktiv":"Runde"],["stats","📊","Stats"],
          ...(profile?.is_admin?[["admin","🛡️","Admin"]]:[])
        ].map(([id,ic,lb])=>(
          <button key={id} className="gb" onClick={()=>setTab(id)} style={{flex:1,padding:"10px 4px 8px",background:"transparent",color:tab===id?T.accent:T.muted,display:"flex",flexDirection:"column",alignItems:"center",gap:2,fontSize:10,fontWeight:tab===id?600:400}}>
            <span style={{fontSize:20}}>{ic}</span>{lb}
          </button>
        ))}
        <button className="gb" onClick={async()=>{await sb.auth.signOut();}} style={{flex:1,padding:"10px 4px 8px",background:"transparent",color:T.muted,display:"flex",flexDirection:"column",alignItems:"center",gap:2,fontSize:10}}>
          <span style={{fontSize:20}}>👤</span>Logout
        </button>
      </nav>
    </div>
  );
}

// ── HOME ──
function HomeView({rounds,profile,setTab,activeRound,user,updProfile}){
  const[editHcp,setEditHcp]=useState(false);
  const[hcpD,setHcpD]=useState(profile?.hcp_index||18);
  const last=rounds[0];
  const avg=rounds.length?(rounds.slice(0,5).reduce((s,r)=>s+(r.totals?.[r.players?.[0]?.id]?.nettoStableford||0),0)/Math.min(5,rounds.length)).toFixed(1):"—";
  return(<div className="fade" style={{padding:"24px 16px 16px"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:24}}>
      <div>
        <div style={{fontFamily:"Georgia,serif",fontSize:28,fontWeight:700,lineHeight:1}}>Golf<span style={{color:T.accent}}>Tracker</span></div>
        <div style={{color:T.muted,fontSize:12,marginTop:4}}>👋 {profile?.display_name||"Spieler"}</div>
      </div>
      <div style={{textAlign:"right"}}>
        <div style={{fontSize:10,color:T.muted,marginBottom:2}}>HCP Index</div>
        {editHcp?<div style={{display:"flex",gap:6}}>
          <input className="gi" type="number" step="0.1" value={hcpD} onChange={e=>setHcpD(parseFloat(e.target.value))} style={{width:80,textAlign:"center",fontSize:18,padding:"4px 8px"}}/>
          <button className="gb" onClick={async()=>{await updProfile({hcp_index:hcpD});setEditHcp(false);}} style={{background:T.accent,color:"#000",padding:"4px 10px",fontSize:12}}>✓</button>
        </div>
        :<div onClick={()=>setEditHcp(true)} style={{cursor:"pointer",background:T.accentGlow,border:`1px solid ${T.accent}`,borderRadius:10,padding:"4px 14px",display:"inline-block"}}>
          <span style={{fontFamily:"Georgia,serif",fontSize:26,fontWeight:700,color:T.accent}}>{profile?.hcp_index??18}</span>
        </div>}
      </div>
    </div>
    {activeRound&&<div onClick={()=>setTab("round")} style={{background:`linear-gradient(135deg,${T.accentDim},#0d2416)`,border:`1px solid ${T.accent}`,borderRadius:14,padding:"14px 18px",marginBottom:16,cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
      <div><div style={{fontSize:11,color:T.accent,fontWeight:600,letterSpacing:1}}>AKTIVE RUNDE</div>
        <div style={{fontSize:16,fontWeight:600,marginTop:2}}>{activeRound.courseName}</div>
        <div style={{fontSize:12,color:T.muted}}>{activeRound.players?.length} Spieler · {activeRound.numHoles} Löcher</div>
      </div><div style={{fontSize:28}}>▶</div>
    </div>}
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:16}}>
      {[["Runden",rounds.length],["⌀ Netto",avg],["Beste",rounds.length?Math.max(...rounds.map(r=>r.totals?.[r.players?.[0]?.id]?.nettoStableford||0)):"—"]].map(([l,v])=>(
        <div key={l} className="card" style={{textAlign:"center",padding:"14px 8px"}}>
          <div style={{fontFamily:"Georgia,serif",fontSize:26,fontWeight:700,color:T.accent}}>{v}</div>
          <div style={{fontSize:10,color:T.muted,marginTop:2}}>{l}</div>
        </div>
      ))}
    </div>
    {last&&<div className="card" style={{marginBottom:12}}>
      <div style={{fontSize:11,color:T.muted,fontWeight:600,letterSpacing:1,marginBottom:8}}>LETZTE RUNDE</div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div><div style={{fontSize:15,fontWeight:600}}>{last.course_name}</div>
          <div style={{fontSize:12,color:T.muted}}>{new Date(last.date).toLocaleDateString("de-DE")} · {last.num_holes}L</div>
          <div style={{marginTop:4}}><TeeChip t={last.tee_type}/></div>
        </div>
        <div style={{textAlign:"right"}}><div style={{fontSize:10,color:T.muted}}>Netto Stableford</div>
          <div style={{fontFamily:"Georgia,serif",fontSize:34,fontWeight:700,color:T.accent,lineHeight:1}}>
            {last.totals?.[last.players?.[0]?.id]?.nettoStableford||"—"}
          </div>
          <div style={{fontSize:11,color:T.muted}}>Brutto: {last.totals?.[last.players?.[0]?.id]?.bruttoScore||"—"}</div>
        </div>
      </div>
    </div>}
    {!activeRound&&<button className="gb" onClick={()=>setTab("round")} style={{width:"100%",background:`linear-gradient(135deg,${T.accentDim},${T.faint})`,color:T.accent,padding:"16px",fontSize:15,fontWeight:600,border:`1px solid ${T.accent}`,marginTop:8}}>⛳ Neue Runde starten</button>}
  </div>);
}

// ── COURSES ──
function CoursesView({courses,setCourses,userId,isAdmin}){
  const[mode,setMode]=useState("list");
  const[editCourse,setEditCourse]=useState(null);
  const[form,setForm]=useState({name:"",location:"",holes:18});
  const[teeForm,setTeeForm]=useState({yellow:{cr:"",sr:"",par:"72"},green:{cr:"",sr:"",par:"72"},red:{cr:"",sr:"",par:"72"}});
  const[saving,setSaving]=useState(false);
  const[delConfirm,setDelConfirm]=useState(null);

  const canEdit=c=>isAdmin||(c.created_by===userId&&!c.is_preset);
  const canDelete=c=>isAdmin||(!c.is_preset&&c.created_by===userId);

  const addCourse=async()=>{
    setSaving(true);
    const tees={};
    Object.entries(teeForm).forEach(([k,v])=>{if(v.cr)tees[k]={cr:parseFloat(v.cr),sr:parseInt(v.sr)||113,par:parseInt(v.par)||72};});
    const nc={id:genId(),name:form.name,location:form.location,tees,holes:Array.from({length:parseInt(form.holes)||18},(_,i)=>({par:4,si:i+1,dist:300})),is_preset:false};
    await DB.addCourse(userId,nc);
    setCourses([...courses,nc]);
    setMode("list");setSaving(false);
  };

  const openEdit=c=>{
    setEditCourse({...c});
    const tf={};
    Object.entries(c.tees||{}).forEach(([k,v])=>{tf[k]={cr:v.cr||"",sr:v.sr||"",par:v.par||"72"};});
    Object.keys(TEE).forEach(k=>{if(!tf[k])tf[k]={cr:"",sr:"",par:"72"};});
    setTeeForm(tf);
    setMode("edit");
  };

  const saveEdit=async()=>{
    setSaving(true);
    const tees={};
    Object.entries(teeForm).forEach(([k,v])=>{if(v.cr)tees[k]={cr:parseFloat(v.cr),sr:parseInt(v.sr)||113,par:parseInt(v.par)||72};});
    const updated={...editCourse,tees,name:editCourse.name,location:editCourse.location};
    await DB.updateCourse(editCourse.id,{name:updated.name,location:updated.location,tees});
    setCourses(courses.map(c=>c.id===updated.id?updated:c));
    setMode("list");setSaving(false);setEditCourse(null);
  };

  const delCourse=async(id)=>{
    await DB.deleteCourse(id);
    setCourses(courses.filter(c=>c.id!==id));
    setDelConfirm(null);
  };

  if(mode==="list")return(<div className="fade" style={{padding:"24px 16px"}}>
    <Hdr title="Plätze" sub={`${courses.length} Plätze · ${isAdmin?"Admin-Ansicht":"alle sichtbar für alle"}`}/>
    {delConfirm&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.75)",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{background:T.card,border:`1px solid ${T.red}`,borderRadius:16,padding:24,width:"100%",maxWidth:340}}>
        <div style={{fontFamily:"Georgia,serif",fontSize:20,fontWeight:700,marginBottom:8}}>Platz löschen?</div>
        <div style={{fontSize:13,color:T.muted,marginBottom:16}}>„{courses.find(c=>c.id===delConfirm)?.name}" wird für alle Spieler entfernt.</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <button className="gb" onClick={()=>setDelConfirm(null)} style={{background:T.faint,color:T.text,padding:"12px",border:`1px solid ${T.border}`}}>Abbrechen</button>
          <button className="gb" onClick={()=>delCourse(delConfirm)} style={{background:T.red,color:"#fff",padding:"12px",fontWeight:600}}>🗑 Löschen</button>
        </div>
      </div>
    </div>}
    <div style={{display:"grid",gap:10,marginBottom:16}}>
      {courses.map(c=><div key={c.id} className="card">
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
          <div style={{flex:1}}>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <div style={{fontSize:15,fontWeight:600}}>{c.name}</div>
              {c.is_preset&&<span style={{fontSize:9,color:T.accent,background:T.accentGlow,border:`1px solid ${T.accent}33`,borderRadius:4,padding:"1px 5px"}}>PRESET</span>}
            </div>
            <div style={{fontSize:12,color:T.muted}}>{c.location}</div>
            <div style={{marginTop:6,display:"flex",gap:4,flexWrap:"wrap"}}>{Object.keys(c.tees||{}).map(k=><TeeChip key={k} t={k}/>)}</div>
          </div>
          {(canEdit(c)||canDelete(c))&&<div style={{display:"flex",gap:6,marginLeft:8,flexShrink:0}}>
            {canEdit(c)&&<button className="gb" onClick={()=>openEdit(c)}
              style={{background:T.faint,color:T.accent,padding:"6px 10px",fontSize:14,border:`1px solid ${T.border}`}}>✏️</button>}
            {canDelete(c)&&<button className="gb" onClick={()=>setDelConfirm(c.id)}
              style={{background:"transparent",color:T.red,padding:"6px 10px",fontSize:16,border:`1px solid rgba(248,113,113,.3)`}}>🗑</button>}
          </div>}
        </div>
      </div>)}
    </div>
    <div style={{fontSize:11,color:T.muted,textAlign:"center",marginBottom:10,padding:"8px",background:T.faint,borderRadius:8}}>
      🌐 Alle hinzugefügten Plätze sind für alle Spieler sichtbar
    </div>
    <button className="gb" onClick={()=>setMode("add")} style={{width:"100%",background:T.faint,color:T.text,padding:"14px",border:`1px solid ${T.border}`}}>✍️ Platz hinzufügen</button>
  </div>);

  // Edit mode
  if(mode==="edit"&&editCourse)return(<div className="fade" style={{padding:"24px 16px"}}>
    <Hdr title="Platz bearbeiten" sub={editCourse.name}/>
    <div style={{display:"grid",gap:12,marginBottom:16}}>
      <label style={{fontSize:12,color:T.muted}}>Platzname
        <input className="gi" style={{marginTop:4}} value={editCourse.name} onChange={e=>setEditCourse({...editCourse,name:e.target.value})}/>
      </label>
      <label style={{fontSize:12,color:T.muted}}>Ort
        <input className="gi" style={{marginTop:4}} value={editCourse.location||""} onChange={e=>setEditCourse({...editCourse,location:e.target.value})}/>
      </label>
    </div>
    <div style={{fontSize:13,color:T.accent,fontWeight:600,marginBottom:10}}>Abschlag-Daten (CR / SR / Par)</div>
    {Object.entries(TEE).map(([k])=>(
      <div key={k} style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:12,padding:12,marginBottom:8}}>
        <TeeChip t={k}/>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginTop:8}}>
          {["cr","sr","par"].map(f=><label key={f} style={{fontSize:11,color:T.muted}}>{f.toUpperCase()}
            <input className="gi" type="number" step="0.1" style={{marginTop:3,padding:"8px 10px"}}
              value={teeForm[k]?.[f]||""}
              onChange={e=>setTeeForm({...teeForm,[k]:{...teeForm[k],[f]:e.target.value}})}/>
          </label>)}
        </div>
      </div>
    ))}
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginTop:8}}>
      <button className="gb" onClick={()=>{setMode("list");setEditCourse(null);}} style={{background:T.faint,color:T.text,padding:"12px",border:`1px solid ${T.border}`}}>← Abbrechen</button>
      <button className="gb" onClick={saveEdit} disabled={saving} style={{background:T.accent,color:"#000",padding:"12px",fontWeight:600}}>{saving?"...":"✓ Speichern"}</button>
    </div>
  </div>);

  return(<div className="fade" style={{padding:"24px 16px"}}>
    <Hdr title="Platz hinzufügen" sub="Manuell"/>
    <div style={{display:"grid",gap:12,marginBottom:16}}>
      <label style={{fontSize:12,color:T.muted}}>Platzname<input className="gi" style={{marginTop:4}} value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="z.B. Golfclub München"/></label>
      <label style={{fontSize:12,color:T.muted}}>Ort<input className="gi" style={{marginTop:4}} value={form.location} onChange={e=>setForm({...form,location:e.target.value})} placeholder="Bayern, Deutschland"/></label>
      <label style={{fontSize:12,color:T.muted}}>Löcher<select className="gi" style={{marginTop:4}} value={form.holes} onChange={e=>setForm({...form,holes:e.target.value})}><option value="9">9</option><option value="18">18</option></select></label>
    </div>
    <div style={{fontSize:13,color:T.accent,fontWeight:600,marginBottom:10}}>Abschlag-Daten</div>
    {Object.entries(TEE).map(([k])=>(
      <div key={k} style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:12,padding:12,marginBottom:8}}>

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginTop:8}}>
          {["cr","sr","par"].map(f=><label key={f} style={{fontSize:11,color:T.muted}}>{f.toUpperCase()}<input className="gi" type="number" step="0.1" style={{marginTop:3,padding:"8px 10px"}} value={teeForm[k]?.[f]||""} onChange={e=>setTeeForm({...teeForm,[k]:{...teeForm[k],[f]:e.target.value}})}/></label>)}
        </div>
      </div>
    ))}
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginTop:8}}>
      <button className="gb" onClick={()=>setMode("list")} style={{background:T.faint,color:T.text,padding:"12px",border:`1px solid ${T.border}`}}>← Zurück</button>
      <button className="gb" onClick={addCourse} disabled={!form.name||saving} style={{background:T.accent,color:"#000",padding:"12px",fontWeight:600,opacity:form.name?1:0.5}}>{saving?"...":"✓ Speichern"}</button>
    </div>
  </div>);
}

// ── ROUND VIEW ──
function RoundView({courses,activeRound,setActiveRound,rounds,saveNewRound,setTab,savedPlayers,updSavedPlayers,userId}){
  const[phase,setPhase]=useState(activeRound?"play":"setup");
  const[lastRound,setLastRound]=useState(null);

  const startRound=cfg=>{
    const td=cfg.course.tees[cfg.teeType]||{cr:72,sr:113,par:72};
    const holes=cfg.course.holes.slice(0,cfg.numHoles).map((h,i)=>({holeNum:i+1,par:h.par||4,si:h.si||i+1,dist:h.dist||0}));
    const players=cfg.players.map(p=>({...p,courseHcp:calcCHcp(p.hcpIndex,td.sr,td.cr,td.par)}));
    const scores={};
    players.forEach(p=>{scores[p.id]=holes.map(h=>({holeNum:h.holeNum,par:h.par,si:h.si,gross:0,fairway:null,gir:null,putts:null,bunker:false,sandSave:null,ob:0}));});
    const r={id:genId(),date:cfg.date,courseId:cfg.course.id,courseName:cfg.course.name,teeType:cfg.teeType,numHoles:cfg.numHoles,cr:td.cr,sr:td.sr,par:td.par,hcpIndex:cfg.players[0]?.hcpIndex,courseHcp:players[0]?.courseHcp,players,scores};
    setActiveRound(r);setPhase("play");
  };

  const finishRound=async r=>{
    const totals={};
    r.players.forEach(p=>{
      const sc=r.scores[p.id]||[];
      totals[p.id]={bruttoScore:sc.reduce((s,h)=>s+(h.gross||0),0),nettoStableford:sc.reduce((s,h)=>s+sfNet(h.gross,h.par,strokesOnHole(p.courseHcp,h.si)),0),bruttoStableford:sc.reduce((s,h)=>s+sfBrut(h.gross,h.par),0),gir:sc.filter(h=>h.gir).length,fairways:sc.filter(h=>h.fairway&&h.par!==3).length,putts:sc.reduce((s,h)=>s+(h.putts||0),0),ob:sc.reduce((s,h)=>s+(h.ob||0),0)};
    });
    const completed={...r,totals};
    await saveNewRound(completed);
    setLastRound(completed);setActiveRound(null);setPhase("summary");
  };

  if(phase==="summary")return<RoundSummary round={lastRound||rounds[0]} setTab={setTab} onNew={()=>setPhase("setup")}/>;
  if(phase==="play"&&activeRound)return<HoleEntry round={activeRound} setRound={setActiveRound} onSave={finishRound} onDiscard={()=>{setActiveRound(null);setPhase("setup");}}/>;
  return<RoundSetup courses={courses} onStart={startRound} setTab={setTab} savedPlayers={savedPlayers} updSavedPlayers={updSavedPlayers} userId={userId}/>;
}

// ── ROUND SETUP ──
function RoundSetup({courses,onStart,setTab,savedPlayers,updSavedPlayers,userId}){
  const today=new Date().toISOString().split("T")[0];
  const[selCourse,setSelCourse]=useState(courses[0]?.id||"");
  const[teeType,setTeeType]=useState("yellow");
  const[numHoles,setNumHoles]=useState(18);
  const[date,setDate]=useState(today);
  const[selectedIds,setSelectedIds]=useState([]);
  const[showAdd,setShowAdd]=useState(false);
  const[newName,setNewName]=useState("");
  const[newHcp,setNewHcp]=useState(18.0);
  const[editMode,setEditMode]=useState(false);
  const[saving,setSaving]=useState(false);

  const course=courses.find(c=>c.id===selCourse);
  const teeData=course?.tees?.[teeType];
  const players=savedPlayers.filter(p=>selectedIds.includes(p.id));

  const toggleSel=id=>{if(selectedIds.includes(id))setSelectedIds(selectedIds.filter(x=>x!==id));else if(selectedIds.length<4)setSelectedIds([...selectedIds,id]);};

  const saveNewPlayer=async()=>{
    if(!newName.trim())return;setSaving(true);
    const np=await DB.addPlayer(userId,{name:newName.trim(),hcpIndex:newHcp});
    updSavedPlayers([...savedPlayers,np]);
    setSelectedIds([...selectedIds,np.id]);
    setNewName("");setNewHcp(18.0);setShowAdd(false);setSaving(false);
  };

  const delPlayer=async id=>{await DB.deletePlayer(id);updSavedPlayers(savedPlayers.filter(p=>p.id!==id));setSelectedIds(selectedIds.filter(x=>x!==id));};
  const updHcp=async(id,val)=>{await DB.updatePlayer(id,parseFloat(val)||0);updSavedPlayers(savedPlayers.map(p=>p.id===id?{...p,hcpIndex:parseFloat(val)||0}:p));};

  return(<div className="fade" style={{padding:"24px 16px 100px"}}>
    <Hdr title="Neue Runde" sub="Runde konfigurieren"/>
    <div style={{marginBottom:16}}>
      <label style={{fontSize:12,color:T.muted}}>📅 Datum
        <input className="gi" type="date" style={{marginTop:4}} value={date} onChange={e=>setDate(e.target.value)}/>
      </label>
      {date!==today&&<div style={{fontSize:11,color:T.yellow,marginTop:4}}>⚠️ Nachträgliche Erfassung – {new Date(date).toLocaleDateString("de-DE",{weekday:"long",day:"2-digit",month:"long",year:"numeric"})}</div>}
    </div>
    <div style={{marginBottom:16}}>
      <label style={{fontSize:12,color:T.muted}}>⛳ Golfplatz
        <select className="gi" style={{marginTop:4}} value={selCourse} onChange={e=>{setSelCourse(e.target.value);setTeeType("yellow");}}>
          {courses.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
        </select>
      </label>
    </div>
    <div style={{marginBottom:16}}>
      <div style={{fontSize:12,color:T.muted,marginBottom:8}}>🔢 Löcher</div>
      <div style={{display:"flex",gap:8}}>
        {[9,18].map(n=><button key={n} className={"tg"+(numHoles===n?" on":"")} onClick={()=>setNumHoles(n)} style={{flex:1,padding:"10px",fontSize:14,fontWeight:600}}>{n} Löcher</button>)}
      </div>
    </div>
    <div style={{marginBottom:16}}>
      <div style={{fontSize:12,color:T.muted,marginBottom:8}}>🎯 Abschlag</div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        {Object.keys(course?.tees||TEE).map(k=><button key={k} className={"tg"+(teeType===k?" on":"")} onClick={()=>setTeeType(k)}>{TEE[k]?.label||k}</button>)}
      </div>
    </div>
    {teeData&&<div className="card" style={{marginBottom:16}}>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",textAlign:"center",gap:8,marginBottom:players.length>0?12:0}}>
        {[["CR",teeData.cr],["Slope",teeData.sr],["Par",teeData.par]].map(([l,v])=>(
          <div key={l}><div style={{fontFamily:"Georgia,serif",fontSize:22,color:T.accent}}>{v}</div><div style={{fontSize:10,color:T.muted}}>{l}</div></div>
        ))}
      </div>
      {players.length>0&&<div style={{borderTop:`1px solid ${T.border}`,paddingTop:10,display:"flex",flexWrap:"wrap",gap:8}}>
        {players.map(p=><div key={p.id} style={{fontSize:11,color:T.muted,background:T.faint,borderRadius:6,padding:"3px 8px"}}>
          {p.name}: <span style={{color:T.accent,fontWeight:600}}>Platz-HCP {calcCHcp(p.hcpIndex,teeData.sr,teeData.cr,teeData.par)}</span>
        </div>)}
      </div>}
    </div>}

    {/* Spieler */}
    <div style={{marginBottom:20}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <div style={{fontSize:12,color:T.muted}}>👥 Spieler <span style={{color:T.accent}}>({selectedIds.length})</span></div>
        <div style={{display:"flex",gap:6}}>
          {savedPlayers.length>0&&<button className="gb" onClick={()=>setEditMode(!editMode)} style={{background:editMode?T.accentGlow:T.faint,color:editMode?T.accent:T.muted,padding:"6px 10px",fontSize:11,border:`1px solid ${editMode?T.accent:T.border}`}}>{editMode?"✓ Fertig":"✏️"}</button>}
          <button className="gb" onClick={()=>setShowAdd(!showAdd)} style={{background:T.faint,color:T.accent,padding:"6px 12px",fontSize:11,border:`1px solid ${T.border}`}}>+ Neu</button>
        </div>
      </div>
      {showAdd&&<div style={{background:T.card,border:`1px solid ${T.accent}`,borderRadius:12,padding:14,marginBottom:10}}>
        <div style={{display:"grid",gridTemplateColumns:"2fr 1fr",gap:8,marginBottom:10}}>
          <label style={{fontSize:11,color:T.muted}}>Name<input className="gi" style={{marginTop:3}} value={newName} onChange={e=>setNewName(e.target.value)} placeholder="Vorname Nachname"/></label>
          <label style={{fontSize:11,color:T.muted}}>HCP<input className="gi" type="number" step="0.1" style={{marginTop:3}} value={newHcp} onChange={e=>setNewHcp(parseFloat(e.target.value)||0)}/></label>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
          <button className="gb" onClick={()=>{setShowAdd(false);setNewName("");}} style={{background:T.faint,color:T.muted,padding:"8px",border:`1px solid ${T.border}`,fontSize:12}}>Abbrechen</button>
          <button className="gb" onClick={saveNewPlayer} disabled={!newName.trim()||saving} style={{background:T.accent,color:"#000",padding:"8px",fontWeight:600,fontSize:12,opacity:newName.trim()?1:0.5}}>{saving?"...":"💾 Speichern"}</button>
        </div>
      </div>}
      {savedPlayers.length===0&&!showAdd&&<div style={{textAlign:"center",padding:"20px",color:T.muted,fontSize:13}}>Klicke auf <span style={{color:T.accent}}>+ Neu</span> um Spieler anzulegen.</div>}
      {savedPlayers.map(p=>{
        const sel=selectedIds.includes(p.id);
        return(<div key={p.id} onClick={()=>!editMode&&toggleSel(p.id)}
          style={{background:sel?T.accentGlow:T.card,border:`1px solid ${sel?T.accent:T.border}`,borderRadius:12,padding:"12px 14px",marginBottom:8,cursor:editMode?"default":"pointer",transition:"all .18s",display:"flex",alignItems:"center",gap:12}}>
          <div style={{width:28,height:28,borderRadius:"50%",background:sel?T.accent:T.faint,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,fontSize:14}}>
            {sel?"✓":"👤"}
          </div>
          <div style={{flex:1}}>
            <div style={{fontSize:14,fontWeight:600,color:sel?T.accent:T.text}}>{p.name}</div>
            {editMode?<div style={{display:"flex",alignItems:"center",gap:6,marginTop:4}}>
              <span style={{fontSize:11,color:T.muted}}>HCP:</span>
              <input className="gi" type="number" step="0.1" value={p.hcpIndex} onChange={e=>updHcp(p.id,e.target.value)} onClick={e=>e.stopPropagation()} style={{width:70,padding:"4px 8px",fontSize:12}}/>
            </div>
            :<div style={{fontSize:11,color:T.muted}}>HCP {p.hcpIndex}{teeData?` · Platz-HCP ${calcCHcp(p.hcpIndex,teeData.sr,teeData.cr,teeData.par)}`:""}</div>}
          </div>
          {editMode&&<button className="gb" onClick={e=>{e.stopPropagation();delPlayer(p.id);}} style={{background:"transparent",color:T.red,padding:"4px 8px",fontSize:18,border:`1px solid rgba(248,113,113,.3)`,borderRadius:8}}>🗑</button>}
        </div>);
      })}
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
      <button className="gb" onClick={()=>setTab("home")} style={{background:T.faint,color:T.text,padding:"14px",border:`1px solid ${T.border}`}}>← Zurück</button>
      <button className="gb" onClick={()=>onStart({course,teeType,numHoles,date,players})} disabled={!course||!teeData||players.length===0}
        style={{background:T.accent,color:"#000",padding:"14px",fontWeight:600,opacity:(course&&teeData&&players.length>0)?1:0.5}}>▶ Starten</button>
    </div>
  </div>);
}

// ── HOLE ENTRY ──
function HoleEntry({round,setRound,onSave,onDiscard}){
  const[holeIdx,setHoleIdx]=useState(()=>{const i=(round.scores[round.players[0]?.id]||[]).findIndex(s=>!s.gross);return i>=0?i:0;});
  const[activePid,setActivePid]=useState(round.players[0]?.id);
  const[confirm,setConfirm]=useState(false);
  const player=round.players.find(p=>p.id===activePid)||round.players[0];
  const sc=round.scores[player.id]||[];
  const hole=sc[holeIdx]||{};
  const st=strokesOnHole(player.courseHcp,hole.si||holeIdx+1);
  const totNet=round.players.map(p=>({name:p.name,pts:(round.scores[p.id]||[]).reduce((s,h)=>h.gross?s+sfNet(h.gross,h.par,strokesOnHole(p.courseHcp,h.si)):s,0)}));

  const upd=(f,v)=>{const s={...round.scores};s[player.id]=s[player.id].map((h,i)=>i===holeIdx?{...h,[f]:v}:h);setRound({...round,scores:s});};

  return(<div style={{padding:"12px 16px 0"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
      <button className="gb" onClick={()=>setConfirm(true)} style={{background:T.faint,color:T.muted,padding:"6px 10px",border:`1px solid ${T.border}`,fontSize:11}}>💾 Speichern</button>
      <div style={{textAlign:"center"}}>
        <div style={{fontFamily:"Georgia,serif",fontSize:16,fontWeight:700}}>{round.courseName}</div>
        <div style={{fontSize:10,color:T.muted}}><TeeChip t={round.teeType}/></div>
      </div>
      <button className="gb" onClick={()=>setConfirm(true)} style={{background:T.accent,color:"#000",padding:"6px 10px",fontSize:11,fontWeight:600}}>🏁 Fertig</button>
    </div>

    {confirm&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.75)",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:16,padding:24,width:"100%",maxWidth:360}}>
        <div style={{fontFamily:"Georgia,serif",fontSize:22,fontWeight:700,marginBottom:8}}>Runde abschließen?</div>
        <div style={{fontSize:13,color:T.muted,marginBottom:14}}>Wird in der Cloud gespeichert.</div>
        {totNet.map(({name,pts})=><div key={name} style={{fontSize:14,padding:"6px 0",borderBottom:`1px solid ${T.faint}`,display:"flex",justifyContent:"space-between"}}>
          <span>👤 {name}</span><span style={{color:T.accent,fontWeight:600}}>{pts} Pkt.</span>
        </div>)}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginTop:16}}>
          <button className="gb" onClick={()=>setConfirm(false)} style={{background:T.faint,color:T.text,padding:"12px",border:`1px solid ${T.border}`}}>Weiter</button>
          <button className="gb" onClick={()=>onSave(round)} style={{background:T.accent,color:"#000",padding:"12px",fontWeight:600}}>✓ Speichern</button>
        </div>
        <button className="gb" onClick={onDiscard} style={{width:"100%",marginTop:8,background:"transparent",color:T.red,padding:"10px",border:`1px solid rgba(248,113,113,.3)`,fontSize:12}}>🗑 Verwerfen</button>
      </div>
    </div>}

    {round.players.length>1&&<div style={{display:"flex",gap:6,marginBottom:10,overflowX:"auto",paddingBottom:4}}>
      {round.players.map(p=>{
        const done=(round.scores[p.id]||[]).filter(s=>s.gross).length;
        return<button key={p.id} className={"tg"+(activePid===p.id?" on":"")} onClick={()=>setActivePid(p.id)} style={{whiteSpace:"nowrap",flexShrink:0}}>
          {p.name} <span style={{fontSize:10,opacity:.7}}>{done}/{round.numHoles}</span>
        </button>;
      })}
    </div>}

    <div style={{display:"flex",gap:5,overflowX:"auto",paddingBottom:8,marginBottom:10}}>
      {sc.map((s,i)=><button key={i} className="gb" onClick={()=>setHoleIdx(i)} style={{minWidth:34,height:34,background:i===holeIdx?T.accent:s.gross?T.faint:T.card,color:i===holeIdx?"#000":s.gross?T.text:T.muted,border:`1px solid ${i===holeIdx?T.accent:T.border}`,fontSize:11,fontWeight:600,borderRadius:7,flexShrink:0}}>
        {i+1}
      </button>)}
    </div>

    <div className="card" style={{marginBottom:10}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <div>
          <div style={{fontFamily:"Georgia,serif",fontSize:30,fontWeight:700,lineHeight:1}}>Loch {hole.holeNum}</div>
          <div style={{fontSize:12,color:T.muted}}>Par {hole.par} · SI {hole.si} · {hole.dist}m</div>
          {st!==0&&<div style={{fontSize:11,marginTop:2,color:st>0?T.accent:T.red}}>{st>0?`+${st} Vorgabeschlag${st>1?"e":""}`:st+" Schlag abgeben"}</div>}
        </div>
        <div style={{textAlign:"right"}}>
          <div style={{fontSize:10,color:T.muted}}>Brutto / Netto</div>
          <div style={{fontSize:20,fontWeight:700}}>{hole.gross?sfBrut(hole.gross,hole.par):"-"} <span style={{color:T.accent}}>{hole.gross?sfNet(hole.gross,hole.par,st):"-"}</span></div>
          <div style={{fontSize:10,color:T.muted}}>Platz-HCP {player.courseHcp}</div>
        </div>
      </div>
      <div style={{marginBottom:12}}>
        <div style={{fontSize:11,color:T.muted,marginBottom:6,fontWeight:600,letterSpacing:1}}>SCHLÄGE (BRUTTO)</div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          <button className="gb" onClick={()=>upd("gross",Math.max(1,(hole.gross||hole.par+2)-1))} style={{width:44,height:44,background:T.faint,color:T.text,fontSize:22,border:`1px solid ${T.border}`}}>−</button>
          <div style={{flex:1,textAlign:"center",fontFamily:"Georgia,serif",fontSize:46,fontWeight:700,lineHeight:1,color:!hole.gross?T.muted:hole.gross<=hole.par-2?T.accent:hole.gross===hole.par-1?"#a3e635":hole.gross===hole.par?T.text:hole.gross===hole.par+1?T.yellow:T.red}}>
            {hole.gross||"—"}
          </div>
          <button className="gb" onClick={()=>upd("gross",(hole.gross||hole.par+1)+1)} style={{width:44,height:44,background:T.faint,color:T.text,fontSize:22,border:`1px solid ${T.border}`}}>+</button>
        </div>
        {hole.gross>0&&<div style={{textAlign:"center",fontSize:11,color:T.muted,marginTop:2}}>
          {hole.gross<hole.par?`-${hole.par-hole.gross}`:hole.gross===hole.par?"Par":`+${hole.gross-hole.par}`}
        </div>}
      </div>
      <div style={{display:"grid",gap:8}}>
        {hole.par!==3&&<Row label="Fairway getroffen?"><Tog val={hole.fairway} onT={()=>upd("fairway",true)} onF={()=>upd("fairway",false)}/></Row>}
        <Row label="GIR?"><Tog val={hole.gir} onT={()=>upd("gir",true)} onF={()=>upd("gir",false)}/></Row>
        <Row label="Putts"><div style={{display:"flex",gap:5}}>{[0,1,2,3,4].map(n=><button key={n} className="gb" onClick={()=>upd("putts",n)} style={{width:36,height:36,background:hole.putts===n?(n>=3?T.red:n===1?T.accent:T.faint):T.card,color:hole.putts===n?"#000":T.muted,border:`1px solid ${hole.putts===n?T.accent:T.border}`,fontSize:13,fontWeight:600}}>{n}</button>)}</div></Row>
        <Row label="Bunker?"><Tog val={hole.bunker} onT={()=>upd("bunker",true)} onF={()=>upd("bunker",false)}/></Row>
        {hole.bunker&&<Row label="Sand Save?"><Tog val={hole.sandSave} onT={()=>upd("sandSave",true)} onF={()=>upd("sandSave",false)}/></Row>}
        <Row label="Penalty / OB"><div style={{display:"flex",gap:5}}>{[0,1,2,3].map(n=><button key={n} className="gb" onClick={()=>upd("ob",n)} style={{width:36,height:36,background:hole.ob===n?(n>0?T.red:T.faint):T.card,color:hole.ob===n?"#000":T.muted,border:`1px solid ${hole.ob===n?(n>0?T.red:T.accent):T.border}`,fontSize:13,fontWeight:600}}>{n}</button>)}</div></Row>
      </div>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,paddingBottom:12}}>
      <button className="gb" onClick={()=>setHoleIdx(Math.max(0,holeIdx-1))} disabled={holeIdx===0} style={{background:T.faint,color:T.text,padding:"12px",border:`1px solid ${T.border}`,opacity:holeIdx===0?0.4:1}}>← Loch {holeIdx}</button>
      <button className="gb" onClick={()=>setHoleIdx(Math.min(round.numHoles-1,holeIdx+1))} disabled={holeIdx===round.numHoles-1} style={{background:holeIdx<round.numHoles-1?T.accent:T.faint,color:holeIdx<round.numHoles-1?"#000":T.muted,padding:"12px",fontWeight:600,opacity:holeIdx===round.numHoles-1?0.4:1}}>Loch {holeIdx+2} →</button>
    </div>
  </div>);
}

// ── ROUND SUMMARY ──
function RoundSummary({round,setTab,onNew}){
  if(!round)return<div style={{padding:24,color:T.muted}}>Keine Runde.</div>;
  return(<div className="fade" style={{padding:"24px 16px"}}>
    <Hdr title="Runden-Auswertung" sub={`${new Date(round.date||round.created_at).toLocaleDateString("de-DE")} · ${round.courseName||round.course_name}`}/>
    {(round.players||[]).map(p=>{
      const t=round.totals?.[p.id]||{};
      const sc=round.scores?.[p.id]||[];
      return(<div key={p.id} className="card" style={{marginBottom:14}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <div><div style={{fontSize:16,fontWeight:600}}>👤 {p.name}</div><div style={{fontSize:11,color:T.muted}}>HCP {p.hcpIndex} · Platz-HCP {p.courseHcp}</div></div>
          <div style={{textAlign:"right"}}><div style={{fontSize:10,color:T.muted}}>Netto Stableford</div>
            <div style={{fontFamily:"Georgia,serif",fontSize:34,fontWeight:700,color:T.accent,lineHeight:1}}>{t.nettoStableford||0}</div>
            <div style={{fontSize:11,color:T.muted}}>Brutto: {t.bruttoScore||0}</div>
          </div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",textAlign:"center",gap:8}}>
          {[["GIR",`${t.gir||0}/${round.numHoles||round.num_holes}`],["FW",`${t.fairways||0}`],["Putts",t.putts||0],["OB",t.ob||0]].map(([l,v])=>(
            <div key={l}><div style={{fontSize:17,fontWeight:600}}>{v}</div><div style={{fontSize:10,color:T.muted}}>{l}</div></div>
          ))}
        </div>
      </div>);
    })}
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
      <button className="gb" onClick={onNew} style={{background:T.faint,color:T.text,padding:"14px",border:`1px solid ${T.border}`}}>Neue Runde</button>
      <button className="gb" onClick={()=>setTab("stats")} style={{background:T.accent,color:"#000",padding:"14px",fontWeight:600}}>📊 Analyse</button>
    </div>
  </div>);
}

// ── STATS ──
function StatsView({rounds}){
  const[sub,setSub]=useState("hcp");
  const allSc=rounds.flatMap(r=>(r.players||[]).flatMap(p=>(r.scores?.[p.id]||[]).map(h=>({...h,chcp:p.courseHcp}))));

  if(!rounds.length)return(<div style={{padding:"24px 16px"}}><Hdr title="Analyse" sub="Noch keine Daten"/><div style={{textAlign:"center",padding:60,color:T.muted}}><div style={{fontSize:48}}>📊</div><div style={{marginTop:12}}>Spiele mindestens eine Runde.</div></div></div>);

  const byPar=p=>allSc.filter(h=>h.par===p);
  const avgOver=arr=>arr.length?(arr.reduce((s,h)=>s+(h.gross||h.par),0)/arr.length-arr.reduce((s,h)=>s+h.par,0)/arr.length):0;
  const fwPct=()=>{const a=allSc.filter(h=>h.par!==3&&h.fairway!==null);return a.length?Math.round(a.filter(h=>h.fairway).length/a.length*100):0;};
  const girPct=()=>{const a=allSc.filter(h=>h.gir!==null);return a.length?Math.round(a.filter(h=>h.gir).length/a.length*100):0;};
  const avgPutts=allSc.filter(h=>h.putts!=null).reduce((s,h)=>s+h.putts,0)/(allSc.filter(h=>h.putts!=null).length||1);

  const hcpData=rounds.map((r,i)=>{
    const p=r.players?.[0];const t=r.totals?.[p?.id];
    return{name:`R${i+1}`,date:new Date(r.date||r.created_at).toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"}),"HCP":p?.hcpIndex,"Netto":t?.nettoStableford||0};
  });

  const radarData=[
    {subject:"Driving",A:fwPct(),fullMark:100},{subject:"GIR",A:girPct(),fullMark:100},
    {subject:"Putten",A:Math.max(0,100-(avgPutts-1.6)*50),fullMark:100},
    {subject:"Par 3",A:Math.max(0,100-avgOver(byPar(3))*30),fullMark:100},
    {subject:"Par 5",A:Math.max(0,100-avgOver(byPar(5))*20),fullMark:100},
  ];

  const tips=[];
  if(fwPct()<50)tips.push("🏌️ Driving: Fairway-Quote unter 50% → Ausrichtung & Schwungtempo üben");
  if(girPct()<40)tips.push("🎯 Approach: GIR unter 40% → Annäherungen mit 7–9-Eisen verbessern");
  if(avgPutts>2.1)tips.push("🟢 Putten: Über 2.1 Putts/Loch → kurze Putts (1–2m) trainieren");
  if(avgOver(byPar(3))>1)tips.push("⛳ Par 3: Starke Verluste → kurzes Eisen und Präzision üben");

  return(<div className="fade" style={{padding:"24px 16px"}}>
    <Hdr title="Analyse" sub={`${rounds.length} Runden`}/>
    <div style={{display:"flex",gap:8,marginBottom:18,overflowX:"auto",paddingBottom:4}}>
      {[["hcp","📈 Verlauf"],["radar","🎯 Radar"],["tips","💡 Tipps"]].map(([k,l])=>(
        <button key={k} className={"tg"+(sub===k?" on":"")} onClick={()=>setSub(k)} style={{whiteSpace:"nowrap"}}>{l}</button>
      ))}
    </div>

    {sub==="hcp"&&<div style={{display:"grid",gap:14}}>
      <div className="card">
        <div style={{fontSize:12,color:T.accent,fontWeight:600,marginBottom:12}}>HCP & Netto Stableford</div>
        <ResponsiveContainer width="100%" height={200}>
          <LineChart data={hcpData} margin={{top:4,right:8,bottom:4,left:-20}}>
            <CartesianGrid strokeDasharray="3 3" stroke={T.faint}/>
            <XAxis dataKey="date" tick={{fill:T.muted,fontSize:10}}/>
            <YAxis yAxisId="l" tick={{fill:T.muted,fontSize:10}}/>
            <YAxis yAxisId="r" orientation="right" tick={{fill:T.muted,fontSize:10}}/>
            <Tooltip contentStyle={{background:T.card,border:`1px solid ${T.border}`,borderRadius:8}}/>
            <Line yAxisId="l" dataKey="HCP" stroke={T.yellow} strokeWidth={2} dot={{fill:T.yellow,r:3}}/>
            <Line yAxisId="r" dataKey="Netto" stroke={T.accent} strokeWidth={2} dot={{fill:T.accent,r:3}}/>
            <Legend wrapperStyle={{fontSize:11,color:T.muted}}/>
          </LineChart>
        </ResponsiveContainer>
      </div>
      <div className="card">
        <div style={{fontSize:12,color:T.accent,fontWeight:600,marginBottom:10}}>Key Stats</div>
        {[[`Fairway % — ${fwPct()}%`,fwPct()>=60?T.accent:fwPct()>=45?T.yellow:T.red,"Ziel: ≥ 60%"],
          [`GIR % — ${girPct()}%`,girPct()>=50?T.accent:girPct()>=35?T.yellow:T.red,"Ziel: ≥ 50%"],
          [`Ø Putts — ${isNaN(avgPutts)?"—":avgPutts.toFixed(2)}/Loch`,avgPutts<=2?T.accent:avgPutts<=2.2?T.yellow:T.red,"Ziel: ≤ 2.0"],
          [`Par 3 ⌀ — +${avgOver(byPar(3)).toFixed(2)}`,avgOver(byPar(3))<=0.8?T.accent:avgOver(byPar(3))<=1.3?T.yellow:T.red,"Ziel: < 1.0"],
          [`Par 5 ⌀ — +${avgOver(byPar(5)).toFixed(2)}`,avgOver(byPar(5))<=0.5?T.accent:avgOver(byPar(5))<=1.0?T.yellow:T.red,"Ziel: < 0.5"],
        ].map(([l,c,z],i)=>(
          <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:`1px solid ${T.faint}`}}>
            <div><div style={{fontSize:13,color:c,fontWeight:600}}>{l}</div><div style={{fontSize:10,color:T.muted}}>{z}</div></div>
          </div>
        ))}
      </div>
    </div>}

    {sub==="radar"&&<div className="card">
      <div style={{fontSize:12,color:T.accent,fontWeight:600,marginBottom:4}}>Performance-Radar</div>
      <ResponsiveContainer width="100%" height={260}>
        <RadarChart data={radarData}>
          <PolarGrid stroke={T.faint}/><PolarAngleAxis dataKey="subject" tick={{fill:T.muted,fontSize:11}}/>
          <Radar dataKey="A" stroke={T.accent} fill={T.accent} fillOpacity={0.25}/>
        </RadarChart>
      </ResponsiveContainer>
    </div>}

    {sub==="tips"&&<div style={{display:"grid",gap:10}}>
      {tips.length===0&&<div className="card" style={{color:T.accent,textAlign:"center",padding:30}}>🏆 Alles im grünen Bereich!</div>}
      {tips.map((t,i)=><div key={i} className="card" style={{borderColor:T.yellow+"44"}}><div style={{fontSize:13,color:T.text,lineHeight:1.6}}>{t}</div></div>)}
      <div className="card">
        <div style={{fontSize:12,color:T.gold,fontWeight:600,marginBottom:10}}>📌 Allgemeine Empfehlungen</div>
        {["Mindestens 1× pro Woche 30 Min. Putting-Training","Driving Range: 60% Eisen, 40% Holz","Vor dem Runden 15 Min. warm spielen","HCP-relevante Runden immer einreichen"].map((t,i)=>(
          <div key={i} style={{fontSize:12,color:T.muted,padding:"5px 0",borderBottom:`1px solid ${T.faint}`,display:"flex",gap:8}}><span style={{color:T.accent}}>✓</span>{t}</div>
        ))}
      </div>
    </div>}
  </div>);
}


// ── ADMIN VIEW ──
function AdminView(){
  const[users,setUsers]=useState([]);
  const[selUser,setSelUser]=useState(null);
  const[userRounds,setUserRounds]=useState([]);
  const[allRounds,setAllRounds]=useState([]);
  const[loading,setLoading]=useState(true);
  const[subTab,setSubTab]=useState("users");

  useEffect(()=>{(async()=>{
    const[u,r]=await Promise.all([DB.getAllProfiles(),DB.getAllRounds()]);
    setUsers(u);setAllRounds(r);setLoading(false);
  })();},[]);

  const openUser=async u=>{
    setSelUser(u);
    const r=await DB.getUserRounds(u.id);
    setUserRounds(r);
  };

  // Stats per user
  const userStats=uid=>{
    const r=allRounds.filter(x=>x.user_id===uid);
    const nets=r.map(x=>x.totals?.[x.players?.[0]?.id]?.nettoStableford||0);
    return{rounds:r.length,avg:nets.length?(nets.reduce((a,b)=>a+b,0)/nets.length).toFixed(1):"—",best:nets.length?Math.max(...nets):"—",lastDate:r[0]?.date||null};
  };

  // Global stats
  const totalRounds=allRounds.length;
  const activeUsers=users.filter(u=>allRounds.some(r=>r.user_id===u.id)).length;
  const allNets=allRounds.flatMap(r=>r.players?.map(p=>r.totals?.[p.id]?.nettoStableford||0)||[]);
  const globalAvg=allNets.length?(allNets.reduce((a,b)=>a+b,0)/allNets.length).toFixed(1):"—";

  if(loading)return<Spin/>;

  // Detail view for a user
  if(selUser)return(<div className="fade" style={{padding:"24px 16px"}}>
    <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:20}}>
      <button className="gb" onClick={()=>setSelUser(null)} style={{background:T.faint,color:T.muted,padding:"8px 14px",border:`1px solid ${T.border}`,fontSize:12}}>← Zurück</button>
      <div>
        <div style={{fontFamily:"Georgia,serif",fontSize:20,fontWeight:700}}>👤 {selUser.display_name}</div>
        <div style={{fontSize:12,color:T.muted}}>HCP {selUser.hcp_index} · {userRounds.length} Runden</div>
      </div>
    </div>
    {userRounds.length===0&&<div style={{textAlign:"center",padding:40,color:T.muted}}>Noch keine Runden gespielt.</div>}
    {userRounds.map(r=>{
      const p0=r.players?.[0];const t=r.totals?.[p0?.id]||{};
      return(<div key={r.id} className="card" style={{marginBottom:10}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <div style={{fontSize:14,fontWeight:600}}>{r.course_name}</div>
            <div style={{fontSize:11,color:T.muted}}>{new Date(r.date).toLocaleDateString("de-DE")} · {r.num_holes}L · <span style={{background:TEE[r.tee_type]?.bg||T.faint,color:TEE[r.tee_type]?.fg||T.text,borderRadius:4,padding:"1px 6px",fontSize:10}}>{TEE[r.tee_type]?.short||r.tee_type}</span></div>
            <div style={{fontSize:11,color:T.muted,marginTop:2}}>GIR: {t.gir||0} · FW: {t.fairways||0} · Putts: {t.putts||0}</div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{fontSize:10,color:T.muted}}>Netto</div>
            <div style={{fontFamily:"Georgia,serif",fontSize:28,fontWeight:700,color:T.accent,lineHeight:1}}>{t.nettoStableford||0}</div>
            <div style={{fontSize:10,color:T.muted}}>Brutto: {t.bruttoScore||0}</div>
          </div>
        </div>
      </div>);
    })}
  </div>);

  return(<div className="fade" style={{padding:"24px 16px"}}>
    <Hdr title="🛡️ Admin" sub="Gesamtübersicht"/>

    {/* Global Stats */}
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:8,marginBottom:20}}>
      {[["Spieler",users.length],["Aktiv",activeUsers],["Runden",totalRounds],["⌀ Netto",globalAvg]].map(([l,v])=>(
        <div key={l} className="card" style={{textAlign:"center",padding:"12px 6px"}}>
          <div style={{fontFamily:"Georgia,serif",fontSize:22,fontWeight:700,color:T.accent}}>{v}</div>
          <div style={{fontSize:9,color:T.muted,marginTop:2}}>{l}</div>
        </div>
      ))}
    </div>

    {/* Sub tabs */}
    <div style={{display:"flex",gap:8,marginBottom:16}}>
      {[["users","👥 Spieler"],["rounds","📋 Runden"]].map(([k,l])=>(
        <button key={k} className={"tg"+(subTab===k?" on":"")} onClick={()=>setSubTab(k)} style={{flex:1,padding:"10px",fontWeight:600}}>{l}</button>
      ))}
    </div>

    {/* Players list */}
    {subTab==="users"&&<div style={{display:"grid",gap:10}}>
      {users.map(u=>{
        const s=userStats(u.id);
        return(<div key={u.id} className="card" style={{cursor:"pointer",transition:"border .18s",border:`1px solid ${T.border}`}}
          onClick={()=>openUser(u)}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style={{display:"flex",alignItems:"center",gap:12}}>
              <div style={{width:40,height:40,borderRadius:"50%",background:T.faint,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0}}>
                {u.is_admin?"🛡️":"👤"}
              </div>
              <div>
                <div style={{fontSize:15,fontWeight:600}}>{u.display_name}{u.is_admin&&<span style={{fontSize:10,color:T.accent,marginLeft:6,background:T.accentGlow,border:`1px solid ${T.accent}`,borderRadius:4,padding:"1px 6px"}}>Admin</span>}</div>
                <div style={{fontSize:11,color:T.muted}}>HCP {u.hcp_index} · {s.rounds} Runden</div>
                {s.lastDate&&<div style={{fontSize:10,color:T.muted}}>Zuletzt: {new Date(s.lastDate).toLocaleDateString("de-DE")}</div>}
              </div>
            </div>
            <div style={{textAlign:"right"}}>
              <div style={{fontSize:10,color:T.muted}}>⌀ Netto</div>
              <div style={{fontFamily:"Georgia,serif",fontSize:24,color:T.accent,fontWeight:700}}>{s.avg}</div>
              <div style={{fontSize:10,color:T.muted}}>Beste: {s.best}</div>
            </div>
          </div>
        </div>);
      })}
    </div>}

    {/* All rounds */}
    {subTab==="rounds"&&<div style={{display:"grid",gap:8}}>
      {allRounds.slice(0,30).map(r=>{
        const p0=r.players?.[0];const t=r.totals?.[p0?.id]||{};
        const u=users.find(x=>x.id===r.user_id);
        return(<div key={r.id} className="card">
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div>
              <div style={{fontSize:13,fontWeight:600}}>{r.course_name}</div>
              <div style={{fontSize:11,color:T.accent}}>👤 {u?.display_name||"?"}</div>
              <div style={{fontSize:11,color:T.muted}}>{new Date(r.date).toLocaleDateString("de-DE")} · {r.num_holes}L</div>
            </div>
            <div style={{textAlign:"right"}}>
              <div style={{fontFamily:"Georgia,serif",fontSize:26,color:T.accent,fontWeight:700,lineHeight:1}}>{t.nettoStableford||0}</div>
              <div style={{fontSize:10,color:T.muted}}>Netto · Brutto {t.bruttoScore||0}</div>
            </div>
          </div>
        </div>);
      })}
      {allRounds.length>30&&<div style={{textAlign:"center",fontSize:12,color:T.muted,padding:8}}>... und {allRounds.length-30} weitere Runden</div>}
    </div>}
  </div>);
}

// ── RENDER ──
const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));
</script>
</body>
</html>
