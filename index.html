// ── Golf Math ──
const genId = () => Math.random().toString(36).slice(2,9);
const calcCHcp = (idx,sr,cr,par) => Math.round(idx*(sr/113)+(cr-par));
const strokesOnHole = (chcp,si) => chcp>=0 ? Math.floor(chcp/18)+(si<=chcp%18?1:0) : (si<=Math.abs(chcp)?-1:0);
const sfNet = (g,par,st) => g ? Math.max(0,2+par+st-g) : 0;
const sfBrut = (g,par) => g ? Math.max(0,2+par-g) : 0;

// ── Simple SVG Charts ──
function SimpleLineChart({data, lines, height=180}) {
  if (!data || data.length < 2) return e("div",{style:{textAlign:"center",padding:30,color:T.muted,fontSize:12}},"Mindestens 2 Runden für Grafik nötig.");
  const W=320,H=height,PL=32,PR=8,PT=8,PB=28;
  return e("svg",{width:"100%",viewBox:`0 0 ${W} ${H}`,style:{overflow:"visible"}},
    [0,0.5,1].map((t,i)=>e("line",{key:i,x1:PL,x2:W-PR,y1:PT+t*(H-PT-PB),y2:PT+t*(H-PT-PB),stroke:T.faint,strokeWidth:1})),
    data.map((d,i)=>e("text",{key:i,x:PL+(i/(data.length-1))*(W-PL-PR),y:H,textAnchor:"middle",fill:T.muted,fontSize:9},d.date||`R${i+1}`)),
    lines.map(l=>{
      const vals=data.map(d=>d[l.key]||0);
      const mn=Math.min(...vals),mx=Math.max(...vals),rng=mx-mn||1;
      const pts=data.map((d,i)=>`${PL+(i/(data.length-1))*(W-PL-PR)},${PT+(1-(d[l.key]||0-mn)/rng)*(H-PT-PB)}`).join(" ");
      return e("g",{key:l.key},
        e("polyline",{points:pts,fill:"none",stroke:l.color||T.accent,strokeWidth:2,strokeLinejoin:"round"}),
        data.map((d,i)=>e("circle",{key:i,cx:PL+(i/(data.length-1))*(W-PL-PR),cy:PT+(1-((d[l.key]||0)-mn)/rng)*(H-PT-PB),r:3,fill:l.color||T.accent}))
      );
    }),
    lines.map((l,i)=>e("g",{key:l.key,transform:`translate(${PL+i*110},${H-4})`},
      e("line",{x1:0,x2:12,y1:-4,y2:-4,stroke:l.color||T.accent,strokeWidth:2}),
      e("text",{x:15,y:0,fill:T.muted,fontSize:9},l.label)
    ))
  );
}
function SimpleBarChart({data,barKey,height=130,color}) {
  if (!data||!data.length) return null;
  const W=320,H=height,PL=28,PR=8,PT=8,PB=24;
  const vals=data.map(d=>d[barKey]||0);
  const maxV=Math.max(...vals,1);
  const bw=Math.max(8,Math.min(28,(W-PL-PR)/data.length-4));
  return e("svg",{width:"100%",viewBox:`0 0 ${W} ${H}`},
    [0,0.5,1].map((t,i)=>e("line",{key:i,x1:PL,x2:W-PR,y1:PT+t*(H-PT-PB),y2:PT+t*(H-PT-PB),stroke:T.faint,strokeWidth:1})),
    data.map((d,i)=>{
      const bh=(d[barKey]||0)/maxV*(H-PT-PB);
      const bx=PL+(i+0.5)*(W-PL-PR)/data.length-bw/2;
      return e("g",{key:i},
        e("rect",{x:bx,y:H-PB-bh,width:bw,height:bh,fill:color||T.blue,rx:3}),
        e("text",{x:bx+bw/2,y:H,textAnchor:"middle",fill:T.muted,fontSize:9},d.date||d.name)
      );
    })
  );
}
function SimpleRadar({data,height=220}) {
  if (!data||!data.length) return null;
  const W=280,H=height,CX=W/2,CY=H/2-10,R=75;
  const n=data.length;
  const ang=i=>((i/n)*2*Math.PI)-Math.PI/2;
  const pt=(i,r)=>[CX+r*Math.cos(ang(i)),CY+r*Math.sin(ang(i))];
  return e("svg",{width:"100%",viewBox:`0 0 ${W} ${H}`},
    [0.25,0.5,0.75,1].map((g,gi)=>e("polygon",{key:gi,points:data.map((_,i)=>pt(i,R*g).join(",")).join(" "),fill:"none",stroke:T.faint,strokeWidth:1})),
    data.map((_,i)=>{const[x,y]=pt(i,R);return e("line",{key:i,x1:CX,y1:CY,x2:x,y2:y,stroke:T.faint,strokeWidth:1});}),
    e("polygon",{points:data.map((d,i)=>pt(i,R*(d.A||0)/100).join(",")).join(" "),fill:T.accent,fillOpacity:.25,stroke:T.accent,strokeWidth:2}),
    data.map((d,i)=>{const[x,y]=pt(i,R+20);return e("text",{key:i,x,y,textAnchor:"middle",dominantBaseline:"middle",fill:T.muted,fontSize:10},d.subject);})
  );
}

// AUTH SCREEN
// ══════════════════════════════════════════
function AuthScreen({onLogin}) {
  const [mode, setMode] = useState("login");
  const [name, setName] = useState("");
  const [email, setEmail] = useState("");
  const [pin, setPin] = useState("");
  const [err, setErr] = useState("");
  const [loading, setLoading] = useState(false);

  const submit = async () => {
    setErr(""); setLoading(true);
    try {
      if (mode === "register") {
        if (!name.trim()||!email.trim()||pin.length<4) { setErr("Bitte alle Felder ausfüllen (PIN min. 4 Zeichen)"); setLoading(false); return; }
        const {data,error} = await sb.auth.signUp({email, password:pin, options:{data:{display_name:name.trim()}}});
        if (error) throw error;
        if (data.user) onLogin(data.user);
        else setErr("Konto erstellt — bitte einloggen.");
      } else {
        const {data,error} = await sb.auth.signInWithPassword({email, password:pin});
        if (error) throw error;
        onLogin(data.user);
      }
    } catch(ex) { setErr(ex.message||"Fehler"); }
    setLoading(false);
  };

  return e("div",{style:{minHeight:"100vh",background:T.bg,display:"flex",alignItems:"center",justifyContent:"center",padding:20}},
    e("div",{style:{width:"100%",maxWidth:360}},
      e("div",{style:{textAlign:"center",marginBottom:28}},
        e("div",{style:{fontSize:52,marginBottom:8}},"⛳"),
        e("div",{style:{fontFamily:"Georgia,serif",fontSize:30,fontWeight:700}},
          "Golf", e("span",{style:{color:T.accent}},"Tracker")),
        e("div",{style:{fontSize:13,color:T.muted,marginTop:4}},"Dein persönlicher Golf-Assistent")
      ),
      e("div",{className:"card",style:{padding:24}},
        // Tabs
        e("div",{style:{display:"flex",gap:8,marginBottom:20}},
          ["login","register"].map(m=>btn({
            flex:1,padding:"10px",background:mode===m?T.accent:T.faint,color:mode===m?"#000":T.muted,
            border:`1px solid ${mode===m?T.accent:T.border}`,fontSize:13,fontWeight:600
          }, ()=>{setMode(m);setErr("");}, m==="login"?"Einloggen":"Registrieren"))
        ),
        e("div",{style:{display:"grid",gap:12}},
          mode==="register" && e("label",{style:{fontSize:12,color:T.muted}},"Name",
            e("input",{style:{marginTop:4},value:name,onChange:ev=>setName(ev.target.value),placeholder:"Vorname Nachname"})
          ),
          e("label",{style:{fontSize:12,color:T.muted}},"E-Mail",
            e("input",{type:"email",style:{marginTop:4},value:email,onChange:ev=>setEmail(ev.target.value),placeholder:"deine@email.de"})
          ),
          e("label",{style:{fontSize:12,color:T.muted}},"PIN (min. 4 Zeichen)",
            e("input",{type:"password",style:{marginTop:4},value:pin,onChange:ev=>setPin(ev.target.value),placeholder:"••••••",onKeyDown:ev=>ev.key==="Enter"&&submit()})
          )
        ),
        err && e("div",{style:{background:"rgba(248,113,113,.1)",border:`1px solid ${T.red}`,borderRadius:8,padding:10,marginTop:12,fontSize:12,color:T.red}},
          "⚠️ ",err),
        btn({width:"100%",marginTop:16,background:T.accent,color:"#000",padding:"14px",fontSize:14,fontWeight:600,opacity:loading?0.6:1},
          submit, loading?"…": mode==="login"?"Einloggen →":"Konto erstellen →")
      )
    )
  );
}

// MAIN APP
// ══════════════════════════════════════════
function App() {
  const [user, setUser] = useState(null);
  const [profile, setProfile] = useState(null);
  const [tab, setTab] = useState("home");
  const [courses, setCourses] = useState([]);
  const [rounds, setRounds] = useState([]);
  const [savedPlayers, setSavedPlayers] = useState([]);
  const [activeRound, setActiveRound] = useState(null);
  const [loading, setLoading] = useState(false);

  useEffect(()=>{
    if (!sb) return;
    // Don't wait - show login immediately, restore session in background
    setLoading(false);
    // Check if already logged in (silent, no spinner)
    sb.auth.getSession().then(({data:{session}})=>{
      if (session?.user) initUser(session.user);
    }).catch(()=>{});
    // Listen for future auth changes
    const {data:{subscription}} = sb.auth.onAuthStateChange((_,session)=>{
      if (session?.user) initUser(session.user);
      else { setUser(null); setProfile(null); }
    });
    return ()=>subscription.unsubscribe();
  },[]);

  const initUser = async (u) => {
    setUser(u);
    try {
      const [prof,rds,sps,crs] = await Promise.all([
        DB.getProfile(u.id), DB.getRounds(u.id),
        DB.getSavedPlayers(u.id), DB.getCourses()
      ]);
      setProfile(prof); setRounds(rds); setSavedPlayers(sps); setCourses(crs);
      const ar = localStorage.getItem("gf_ar_"+u.id);
      if (ar) { setActiveRound(JSON.parse(ar)); setTab("round"); }
    } catch(err) { console.error("initUser error:", err); }
    setLoading(false);
  };

  const updAR = ar => {
    setActiveRound(ar);
    if (ar) localStorage.setItem("gf_ar_"+user.id, JSON.stringify(ar));
    else localStorage.removeItem("gf_ar_"+user.id);
  };
  const saveNewRound = async r => {
    await DB.saveRound(user.id, r);
    const fresh = await DB.getRounds(user.id);
    setRounds(fresh);
  };

  // No spinner - show login or app immediately
  if (!user || !sb) return e(AuthScreen, {onLogin: u=>initUser(u)});

  const navItems = [
    ["home","🏠","Home"], ["courses","🗺️","Plätze"],
    ["round","⛳",activeRound?"Aktiv":"Runde"], ["stats","📊","Stats"],
    ...(profile?.is_admin ? [["admin","🛡️","Admin"]] : [])
  ];

  return e("div",{style:{fontFamily:"system-ui,sans-serif",color:T.text,background:T.bg,maxWidth:480,margin:"0 auto",minHeight:"100vh",paddingBottom:76}},
    tab==="home"    && e(HomeView,    {rounds,profile,setTab,activeRound,userId:user.id,updProfile:async d=>{await DB.updateProfile(user.id,d);setProfile({...profile,...d});}}),
    tab==="courses" && e(CoursesView, {courses,setCourses,userId:user.id,isAdmin:!!profile?.is_admin}),
    tab==="round"   && e(RoundView,   {courses,activeRound,setActiveRound:updAR,rounds,saveNewRound,setTab,savedPlayers,setSavedPlayers,userId:user.id}),
    tab==="stats"   && e(StatsView,   {rounds}),
    tab==="admin"   && profile?.is_admin && e(AdminView, {}),
    e("nav",{style:{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:480,background:"#040b06",borderTop:`1px solid ${T.border}`,display:"flex",zIndex:200}},
      navItems.map(([id,ic,lb])=>btn({
        flex:1,padding:"10px 4px 8px",background:"transparent",
        color:tab===id?T.accent:T.muted,display:"flex",flexDirection:"column",
        alignItems:"center",gap:2,fontSize:10,fontWeight:tab===id?600:400
      }, ()=>setTab(id), e("span",{style:{fontSize:20}},ic), lb)),
      btn({flex:1,padding:"10px 4px 8px",background:"transparent",color:T.muted,display:"flex",flexDirection:"column",alignItems:"center",gap:2,fontSize:10},
        async()=>await sb.auth.signOut(), e("span",{style:{fontSize:20}},"👤"), "Logout")
    )
  );
}

function CoursesView({courses,setCourses,userId,isAdmin}) {
  const [mode,setMode] = useState("list");
  const [editCourse,setEditCourse] = useState(null);
  const [form,setForm] = useState({name:"",location:"",holes:18});
  const [teeForm,setTeeForm] = useState({yellow:{cr:"",sr:"",par:"72"},green:{cr:"",sr:"",par:"72"},red:{cr:"",sr:"",par:"72"},blue:{cr:"",sr:"",par:"72"},orange:{cr:"",sr:"",par:"72"}});
  const [saving,setSaving] = useState(false);
  const [delConfirm,setDelConfirm] = useState(null);

  const canEdit = c => isAdmin || (c.created_by===userId && !c.is_preset);
  const canDelete = c => isAdmin || (!c.is_preset && c.created_by===userId);

  const addCourse = async () => {
    setSaving(true);
    const tees = {};
    Object.entries(teeForm).forEach(([k,v])=>{ if(v.cr) tees[k]={cr:parseFloat(v.cr),sr:parseInt(v.sr)||113,par:parseInt(v.par)||72}; });
    const nc = {id:genId(),name:form.name,location:form.location,tees,holes:Array.from({length:parseInt(form.holes)||18},(_,i)=>({par:4,si:i+1,dist:300}))};
    await DB.addCourse(userId, nc);
    setCourses([...courses, {...nc,is_preset:false}]);
    setMode("list"); setSaving(false);
  };

  const openEdit = c => {
    setEditCourse({...c});
    const tf = {};
    Object.entries(c.tees||{}).forEach(([k,v])=>{ tf[k]={cr:v.cr||"",sr:v.sr||"",par:v.par||"72"}; });
    Object.keys(TEE).forEach(k=>{ if(!tf[k]) tf[k]={cr:"",sr:"",par:"72"}; });
    setTeeForm(tf); setMode("edit");
  };

  const saveEdit = async () => {
    setSaving(true);
    const tees = {};
    Object.entries(teeForm).forEach(([k,v])=>{ if(v.cr) tees[k]={cr:parseFloat(v.cr),sr:parseInt(v.sr)||113,par:parseInt(v.par)||72}; });
    await DB.updateCourse(editCourse.id, {name:editCourse.name,location:editCourse.location,tees});
    setCourses(courses.map(c=>c.id===editCourse.id?{...editCourse,tees}:c));
    setMode("list"); setSaving(false); setEditCourse(null);
  };

  const delCourse = async id => {
    await DB.deleteCourse(id);
    setCourses(courses.filter(c=>c.id!==id));
    setDelConfirm(null);
  };

  const teeInput = (teeKey) => e("div",{key:teeKey,style:{background:T.bg,border:`1px solid ${T.border}`,borderRadius:12,padding:12,marginBottom:8}},

        e("input",{type:"number",step:"0.1",style:{marginTop:3,padding:"8px 10px"},value:teeForm[teeKey]?.[f]||"",

    ),

    Object.keys(TEE).map(k=>teeInput(k)),
    e("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginTop:8}},

  if (mode==="add") return e("div",{className:"fade",style:{padding:"24px 16px"}},
    e(Hdr,{title:"Platz hinzufügen",sub:"Manuell"}),
    e("div",{style:{display:"grid",gap:12,marginBottom:16}},
      e("label",{style:{fontSize:12,color:T.muted}},"Platzname",e("input",{style:{marginTop:4},value:form.name,onChange:ev=>setForm({...form,name:ev.target.value}),placeholder:"z.B. Golfclub München"})),
      e("label",{style:{fontSize:12,color:T.muted}},"Ort",e("input",{style:{marginTop:4},value:form.location,onChange:ev=>setForm({...form,location:ev.target.value}),placeholder:"Bayern, Deutschland"})),
      e("label",{style:{fontSize:12,color:T.muted}},"Löcher",e("select",{style:{marginTop:4},value:form.holes,onChange:ev=>setForm({...form,holes:ev.target.value})},e("option",{value:9},"9"),e("option",{value:18},"18")))

    e("div",{style:{fontSize:13,color:T.accent,fontWeight:600,marginBottom:10}},"Abschlag-Daten (CR / SR / Par)"),
    Object.keys(TEE).map(k=>teeInput(k)),

        e("div",{style:{fontSize:13,color:T.muted,marginBottom:16}},`„${courses.find(c=>c.id===delConfirm)?.name}" wird für alle entfernt.`),
        e("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}},

          btn({background:T.red,color:"#fff",padding:"12px",fontWeight:600,borderRadius:10},()=>delCourse(delConfirm),"🗑 Löschen")

    ),
    e("div",{style:{display:"grid",gap:10,marginBottom:16}},
      courses.map(c=>e("div",{key:c.id,className:"card"},
        e("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}},

            canEdit(c) && btn({background:T.faint,color:T.accent,padding:"6px 10px",fontSize:14,border:`1px solid ${T.border}`,borderRadius:8},()=>openEdit(c),"✏️"),

// ROUND VIEW
// ══════════════════════════════════════════
function RoundView({courses,activeRound,setActiveRound,rounds,saveNewRound,setTab,savedPlayers,setSavedPlayers,userId}) {
  const [phase,setPhase] = useState(activeRound?"play":"setup");
  const [lastRound,setLastRound] = useState(null);

  const startRound = cfg => {
    const td = cfg.course.tees[cfg.teeType]||{cr:72,sr:113,par:72};
    const holes = (cfg.course.holes||[]).slice(0,cfg.numHoles).map((h,i)=>({holeNum:i+1,par:h.par||4,si:h.si||i+1,dist:h.dist||0}));
    const players = cfg.players.map(p=>({...p,courseHcp:calcCHcp(p.hcpIndex,td.sr,td.cr,td.par)}));
    const scores = {};
    players.forEach(p=>{ scores[p.id]=holes.map(h=>({holeNum:h.holeNum,par:h.par,si:h.si,gross:0,fairway:null,gir:null,putts:null,bunker:false,sandSave:null,ob:0})); });
    const r = {id:genId(),date:cfg.date,courseId:cfg.course.id,courseName:cfg.course.name,teeType:cfg.teeType,numHoles:cfg.numHoles,cr:td.cr,sr:td.sr,par:td.par,hcpIndex:cfg.players[0]?.hcpIndex,courseHcp:players[0]?.courseHcp,players,scores};
    setActiveRound(r); setPhase("play");
  };

  const finishRound = async r => {
    const totals = {};
    r.players.forEach(p=>{
      const sc = r.scores[p.id]||[];
      totals[p.id] = {
        bruttoScore:sc.reduce((s,h)=>s+(h.gross||0),0),
        nettoStableford:sc.reduce((s,h)=>s+sfNet(h.gross,h.par,strokesOnHole(p.courseHcp,h.si)),0),
        bruttoStableford:sc.reduce((s,h)=>s+sfBrut(h.gross,h.par),0),
        gir:sc.filter(h=>h.gir).length, fairways:sc.filter(h=>h.fairway&&h.par!==3).length,
        putts:sc.reduce((s,h)=>s+(h.putts||0),0), ob:sc.reduce((s,h)=>s+(h.ob||0),0)
      };
    });
    const completed = {...r,totals};
    await saveNewRound(completed);
    setLastRound(completed); setActiveRound(null); setPhase("summary");
  };

  if (phase==="summary") return e(RoundSummary,{round:lastRound||rounds[0],setTab,onNew:()=>setPhase("setup")});
  if (phase==="play" && activeRound) return e(HoleEntry,{round:activeRound,setRound:setActiveRound,onSave:finishRound,onDiscard:()=>{setActiveRound(null);setPhase("setup");}});
  return e(RoundSetup,{courses,onStart:startRound,setTab,savedPlayers,setSavedPlayers,userId});
}

// ── HOLE ENTRY ──
function HoleEntry({round,setRound,onSave,onDiscard}) {
  const [holeIdx,setHoleIdx] = useState(()=>{ const i=(round.scores[round.players[0]?.id]||[]).findIndex(s=>!s.gross); return i>=0?i:0; });
  const [activePid,setActivePid] = useState(round.players[0]?.id);
  const [confirm,setConfirm] = useState(false);

  const player = round.players.find(p=>p.id===activePid)||round.players[0];
  const sc = round.scores[player.id]||[];
  const hole = sc[holeIdx]||{};

// STATS VIEW
// ══════════════════════════════════════════
function StatsView({rounds}) {
  const [sub,setSub] = useState("hcp");

  const norm = rounds.map(r=>({
    ...r, courseName:r.course_name||r.courseName||"",
    teeType:r.tee_type||r.teeType||"yellow",
    numHoles:r.num_holes||r.numHoles||18,
    players:r.players||[], scores:r.scores||{}, totals:r.totals||{},
    date:r.date||r.created_at,
  }));

  if (!norm.length) return e("div",{style:{padding:"24px 16px"}},
    e(Hdr,{title:"Analyse",sub:"Noch keine Daten"}),
    e("div",{style:{textAlign:"center",padding:60,color:T.muted}},e("div",{style:{fontSize:48}},"📊"),e("div",{style:{marginTop:12}},"Spiele mindestens eine Runde."))
  );

  const allSc = norm.flatMap(r=>(r.players||[]).flatMap(p=>(r.scores?.[p.id]||[]).map(h=>({...h,chcp:p.courseHcp}))));
  const byPar = p => allSc.filter(h=>h.par===p);
  const avgOver = arr => arr.length?(arr.reduce((s,h)=>s+(h.gross||h.par),0)/arr.length - arr.reduce((s,h)=>s+h.par,0)/arr.length):0;
  const fwPct = () => { const a=allSc.filter(h=>h.par!==3&&h.fairway!==null); return a.length?Math.round(a.filter(h=>h.fairway).length/a.length*100):0; };
  const girPct = () => { const a=allSc.filter(h=>h.gir!==null); return a.length?Math.round(a.filter(h=>h.gir).length/a.length*100):0; };
  const avgPutts = allSc.filter(h=>h.putts!=null).reduce((s,h)=>s+h.putts,0) / (allSc.filter(h=>h.putts!=null).length||1);

  const hcpData = norm.map((r,i)=>{
    const p=r.players?.[0]; const t=r.totals?.[p?.id]||{};
    return {name:`R${i+1}`, date:new Date(r.date).toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"}),
      HCP:parseFloat(p?.hcpIndex||0), Netto:t.nettoStableford||0, Putts:t.putts||0};
  });

  const radarData = [
    {subject:"Driving",A:fwPct(),fullMark:100},{subject:"GIR",A:girPct(),fullMark:100},
    {subject:"Putten",A:Math.max(0,100-(avgPutts-1.6)*50),fullMark:100},
    {subject:"Par 3",A:Math.max(0,100-avgOver(byPar(3))*30),fullMark:100},
    {subject:"Par 5",A:Math.max(0,100-avgOver(byPar(5))*20),fullMark:100},
  ];

  const tips = [];
  if (fwPct()<50) tips.push("🏌️ Driving: Fairway-Quote unter 50% → Ausrichtung & Schwungtempo üben");
  if (girPct()<40) tips.push("🎯 Approach: GIR unter 40% → Annäherungen mit 7–9-Eisen verbessern");
  if (avgPutts>2.1) tips.push("🟢 Putten: Über 2.1 Putts/Loch → kurze Putts (1–2m) trainieren");
  if (avgOver(byPar(3))>1) tips.push("⛳ Par 3: Starke Verluste → kurzes Eisen und Präzision üben");

  const statRows = [
    [`Fairway — ${fwPct()}%`, fwPct()>=60?T.accent:fwPct()>=45?T.yellow:T.red, "Ziel: ≥ 60%"],
    [`GIR — ${girPct()}%`, girPct()>=50?T.accent:girPct()>=35?T.yellow:T.red, "Ziel: ≥ 50%"],
    [`Ø Putts — ${isNaN(avgPutts)?"—":avgPutts.toFixed(2)}/Loch`, avgPutts<=2?T.accent:avgPutts<=2.2?T.yellow:T.red, "Ziel: ≤ 2.0"],
    [`Par 3 ⌀ — +${avgOver(byPar(3)).toFixed(2)}`, avgOver(byPar(3))<=0.8?T.accent:avgOver(byPar(3))<=1.3?T.yellow:T.red, "Ziel: < 1.0"],
    [`Par 5 ⌀ — +${avgOver(byPar(5)).toFixed(2)}`, avgOver(byPar(5))<=0.5?T.accent:avgOver(byPar(5))<=1.0?T.yellow:T.red, "Ziel: < 0.5"],
  ];

  return e("div",{className:"fade",style:{padding:"24px 16px"}},
    e(Hdr,{title:"Analyse",sub:norm.length+" Runden"}),
    e("div",{style:{display:"flex",gap:8,marginBottom:18,overflowX:"auto",paddingBottom:4}},
      [["hcp","📈 Verlauf"],["radar","🎯 Radar"],["tips","💡 Tipps"],["sim","🧮 HCP-Sim"]].map(([k,l])=>
        e("button",{key:k,className:"tg"+(sub===k?" on":""),onClick:()=>setSub(k),style:{whiteSpace:"nowrap"}},l)
      )
    ),
    sub==="hcp" && e("div",{style:{display:"grid",gap:14}},
      e("div",{className:"card"},
        e("div",{style:{fontSize:12,color:T.accent,fontWeight:600,marginBottom:12}},"HCP & Netto Stableford"),
        e(SimpleLineChart,{data:hcpData,lines:[{key:"HCP",label:"HCP Index",color:T.yellow},{key:"Netto",label:"Netto Stableford",color:T.accent}],height:180})
      ),
      e("div",{className:"card"},
        e("div",{style:{fontSize:12,color:T.accent,fontWeight:600,marginBottom:8}},"Putts pro Runde"),
        e(SimpleBarChart,{data:hcpData,barKey:"Putts",color:T.blue,height:130}),
        e("div",{style:{fontSize:11,color:T.muted,textAlign:"center",marginTop:6}},"Ziel: ≤ 30 Putts / 18 Löcher")
      ),
      e("div",{className:"card"},
        e("div",{style:{fontSize:12,color:T.accent,fontWeight:600,marginBottom:10}},"Key Stats"),
        statRows.map(([l,c,z],i)=>e("div",{key:i,style:{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:`1px solid ${T.faint}`}},
          e("div",{},e("div",{style:{fontSize:13,color:c,fontWeight:600}},l),e("div",{style:{fontSize:10,color:T.muted}},z))
        ))
      )
    ),
    sub==="radar" && e("div",{className:"card"},
      e("div",{style:{fontSize:12,color:T.accent,fontWeight:600,marginBottom:8}},"Performance-Radar"),
      e("div",{style:{display:"flex",justifyContent:"center"}},e(SimpleRadar,{data:radarData,height:220}))
    ),
    sub==="sim" && e(HcpSimulator,{rounds:norm}),
    sub==="tips" && e("div",{style:{display:"grid",gap:10}},
      tips.length===0 && e("div",{className:"card",style:{color:T.accent,textAlign:"center",padding:30}},"🏆 Alles im grünen Bereich!"),
      tips.map((t,i)=>e("div",{key:i,className:"card",style:{borderColor:T.yellow+"44"}},e("div",{style:{fontSize:13,color:T.text,lineHeight:1.6}},t))),
      e("div",{className:"card"},
        e("div",{style:{fontSize:12,color:T.gold,fontWeight:600,marginBottom:10}},"📌 Allgemeine Empfehlungen"),
        ["Mindestens 1× pro Woche 30 Min. Putting","Driving Range: 60% Eisen, 40% Holz","Vor Runden 15 Min. warm spielen","HCP-relevante Runden immer einreichen"].map((t,i)=>
          e("div",{key:i,style:{fontSize:12,color:T.muted,padding:"5px 0",borderBottom:`1px solid ${T.faint}`,display:"flex",gap:8}},e("span",{style:{color:T.accent}},"✓"),t)
        )
      )
    )
  );
}


// ══════════════════════════════════════════
// HCP SIMULATOR
// ══════════════════════════════════════════
function HcpSimulator({rounds}) {
  // WHS: Score Differential = (Gross - CR) * 113 / SR
  // HCP Index = avg of best 8 from last 20 differentials * 0.96
  const calcDiff = r => {
    const p = r.players?.[0];
    const t = r.totals?.[p?.id]||{};
    const gross = t.bruttoScore;
    if (!gross || !r.cr || !r.sr) return null;
    return parseFloat(((gross - r.cr) * 113 / r.sr).toFixed(1));
  };

  const [selected, setSelected] = useState(rounds.map(r=>r.id));

  const toggle = id => setSelected(sel=>sel.includes(id)?sel.filter(x=>x!==id):[...sel,id]);
  const selectAll = () => setSelected(rounds.map(r=>r.id));
  const clearAll = () => setSelected([]);

  // Compute current HCP from all rounds
  const allDiffs = rounds.map(r=>({...r,diff:calcDiff(r)})).filter(r=>r.diff!==null);
  const selDiffs = allDiffs.filter(r=>selected.includes(r.id)).map(r=>r.diff).sort((a,b)=>a-b);
  const best8 = selDiffs.slice(0,Math.min(8,selDiffs.length));
  const simHcp = best8.length ? parseFloat((best8.reduce((a,b)=>a+b,0)/best8.length*0.96).toFixed(1)) : null;

  // Current HCP from last rounds
  const curDiffs = allDiffs.slice(0,20).map(r=>r.diff).sort((a,b)=>a-b);
  const curBest8 = curDiffs.slice(0,Math.min(8,curDiffs.length));
  const curHcp = curBest8.length ? parseFloat((curBest8.reduce((a,b)=>a+b,0)/curBest8.length*0.96).toFixed(1)) : null;

  const delta = (simHcp!==null && curHcp!==null) ? parseFloat((simHcp-curHcp).toFixed(1)) : null;

  if (!rounds.length) return e("div",{className:"card",style:{textAlign:"center",padding:30,color:T.muted}},"Noch keine Runden vorhanden.");

  return e("div",{style:{display:"grid",gap:14}},
    // Result card
    e("div",{className:"card",style:{background:`linear-gradient(135deg,${T.accentDim}22,${T.card})`}},
      e("div",{style:{fontSize:12,color:T.accent,fontWeight:600,marginBottom:12}},"🧮 HCP Simulation (WHS-Formel)"),
      e("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",textAlign:"center",gap:12}},
        e("div",{},
          e("div",{style:{fontFamily:"Georgia,serif",fontSize:28,fontWeight:700,color:T.muted}},curHcp!==null?curHcp.toFixed(1):"—"),
          e("div",{style:{fontSize:11,color:T.muted,marginTop:2}},"Aktuell")
        ),
        e("div",{style:{display:"flex",alignItems:"center",justifyContent:"center"}},
          e("div",{style:{fontSize:28,color:T.faint}},"→")
        ),
        e("div",{},
          e("div",{style:{fontFamily:"Georgia,serif",fontSize:28,fontWeight:700,color:simHcp!==null?(delta<0?T.accent:delta>0?T.red:T.text):T.muted}},simHcp!==null?simHcp.toFixed(1):"—"),
          e("div",{style:{fontSize:11,color:T.muted,marginTop:2}},"Simuliert")
        )
      ),
      delta!==null && e("div",{style:{textAlign:"center",marginTop:12,fontSize:13,color:delta<0?T.accent:delta>0?T.red:T.muted,fontWeight:600}},
        delta<0 ? `▼ ${Math.abs(delta)} Verbesserung` : delta>0 ? `▲ ${delta} Verschlechterung` : "Keine Änderung"
      ),
      e("div",{style:{fontSize:11,color:T.muted,textAlign:"center",marginTop:8}},
        `Beste ${best8.length} von ${selDiffs.length} ausgewählten Runden · × 0.96`
      )
    ),
    // Controls
    e("div",{style:{display:"flex",gap:8,justifyContent:"flex-end"}},
      e("button",{className:"tg",onClick:selectAll},"Alle auswählen"),
      e("button",{className:"tg",onClick:clearAll},"Alle abwählen")
    ),
    // Round list
    e("div",{style:{display:"grid",gap:8}},
      allDiffs.length===0 && e("div",{className:"card",style:{color:T.muted,textAlign:"center",padding:20,fontSize:13}},
        "Keine auswertbaren Runden (Brutto-Score, CR und SR werden benötigt)."
      ),
      allDiffs.map(r=>{
        const sel = selected.includes(r.id);
        const p = r.players?.[0]; const t = r.totals?.[p?.id]||{};
        const isBest = sel && selDiffs.indexOf(r.diff) < 8;
        return e("div",{key:r.id,onClick:()=>toggle(r.id),
          style:{background:sel?T.accentGlow:T.card,border:`1px solid ${sel?T.accent:T.border}`,borderRadius:12,padding:"12px 14px",cursor:"pointer",display:"flex",alignItems:"center",gap:12,transition:"all .18s"}},
          e("div",{style:{width:28,height:28,borderRadius:"50%",background:sel?T.accent:T.faint,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,fontSize:13}},sel?"✓":"○"),
          e("div",{style:{flex:1}},
            e("div",{style:{fontSize:13,fontWeight:600,color:sel?T.accent:T.text}},r.courseName||r.course_name),
            e("div",{style:{fontSize:11,color:T.muted}},new Date(r.date).toLocaleDateString("de-DE")+" · Brutto "+t.bruttoScore),
            e("div",{style:{fontSize:11,color:T.muted}},"CR "+r.cr+" / SR "+r.sr)
          ),
          e("div",{style:{textAlign:"right",flexShrink:0}},
            e("div",{style:{fontFamily:"Georgia,serif",fontSize:22,fontWeight:700,color:isBest?T.accent:sel?T.muted:T.faint}},r.diff>0?"+"+r.diff:r.diff),
            e("div",{style:{fontSize:9,color:T.muted}},"Diff."),
            isBest && e("div",{style:{fontSize:9,color:T.accent,marginTop:2}},"★ top 8")
          )
        );
      })
    ),
    e("div",{className:"card",style:{borderColor:T.faint}},
      e("div",{style:{fontSize:11,color:T.muted,lineHeight:1.6}},
        "ℹ️ WHS-Formel: Score Differential = (Brutto − CR) × 113 ÷ SR
",
        "HCP Index = Ø der besten 8 Differentials × 0.96
",
        "Nur Runden mit eingetragenen Brutto-Scores werden berücksichtigt."
      )
    )
  );
}

// ══════════════════════════════════════════
// ADMIN VIEW
// ══════════════════════════════════════════
function AdminView() {
  const [users,setUsers] = useState([]);
  const [allRounds,setAllRounds] = useState([]);
  const [selUser,setSelUser] = useState(null);
  const [userRounds,setUserRounds] = useState([]);
  const [loading,setLoading] = useState(true);
  const [sub,setSub] = useState("users");

  useEffect(()=>{(async()=>{
    const [u,r] = await Promise.all([DB.getAllProfiles(), DB.getAllRounds()]);
    setUsers(u); setAllRounds(r); setLoading(false);
  })();},[]);

  const openUser = async u => {
    setSelUser(u);
    const r = await DB.getAllRounds();
    setUserRounds(r.filter(x=>x.user_id===u.id));
  };

  if (loading) return e(Spinner);

  const stats = uid => {
    const r = allRounds.filter(x=>x.user_id===uid);
    const nets = r.map(x=>x.totals?.[x.players?.[0]?.id]?.nettoStableford||0);
    return {rounds:r.length, avg:nets.length?(nets.reduce((a,b)=>a+b,0)/nets.length).toFixed(1):"—", best:nets.length?Math.max(...nets):"—", last:r[0]?.date||null};
  };

  const globalNets = allRounds.flatMap(r=>r.players?.map(p=>r.totals?.[p.id]?.nettoStableford||0)||[]);
  const globalAvg = globalNets.length?(globalNets.reduce((a,b)=>a+b,0)/globalNets.length).toFixed(1):"—";

  if (selUser) return e("div",{className:"fade",style:{padding:"24px 16px"}},
    e("div",{style:{display:"flex",alignItems:"center",gap:12,marginBottom:20}},
      btn({background:T.faint,color:T.muted,padding:"8px 14px",border:`1px solid ${T.border}`,borderRadius:8,fontSize:12},()=>setSelUser(null),"← Zurück"),
      e("div",{},
        e("div",{style:{fontFamily:"Georgia,serif",fontSize:20,fontWeight:700}},"👤 "+selUser.display_name),
        e("div",{style:{fontSize:12,color:T.muted}},"HCP "+selUser.hcp_index+" · "+userRounds.length+" Runden")
      )
    ),
    userRounds.length===0 && e("div",{style:{textAlign:"center",padding:40,color:T.muted}},"Noch keine Runden."),
    userRounds.map(r=>{
      const p=r.players?.[0]; const t=r.totals?.[p?.id]||{};
      return e("div",{key:r.id,className:"card",style:{marginBottom:10}},
        e("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center"}},
          e("div",{},
            e("div",{style:{fontSize:14,fontWeight:600}},r.course_name),
            e("div",{style:{fontSize:11,color:T.muted}},new Date(r.date).toLocaleDateString("de-DE")+" · "+(r.num_holes||18)+"L"),
            e("div",{style:{fontSize:11,color:T.muted}},"GIR:"+(t.gir||0)+" FW:"+(t.fairways||0)+" Putts:"+(t.putts||0))
          ),
          e("div",{style:{textAlign:"right"}},
            e("div",{style:{fontFamily:"Georgia,serif",fontSize:28,color:T.accent,fontWeight:700,lineHeight:1}},t.nettoStableford||0),
            e("div",{style:{fontSize:10,color:T.muted}},"Brutto: "+(t.bruttoScore||0))
          )
        )
      );
    })
  );

  return e("div",{className:"fade",style:{padding:"24px 16px"}},
    e(Hdr,{title:"🛡️ Admin",sub:"Gesamtübersicht"}),
    e("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:8,marginBottom:20}},
      [["Spieler",users.length],["Runden",allRounds.length],["⌀ Netto",globalAvg],["Aktiv",users.filter(u=>allRounds.some(r=>r.user_id===u.id)).length]].map(([l,v])=>
        e("div",{key:l,className:"card",style:{textAlign:"center",padding:"12px 6px"}},
          e("div",{style:{fontFamily:"Georgia,serif",fontSize:22,fontWeight:700,color:T.accent}},v),
          e("div",{style:{fontSize:9,color:T.muted,marginTop:2}},l)
        )
      )
    ),
    e("div",{style:{display:"flex",gap:8,marginBottom:16}},
      [["users","👥 Spieler"],["rounds","📋 Alle Runden"]].map(([k,l])=>
        e("button",{key:k,className:"tg"+(sub===k?" on":""),onClick:()=>setSub(k),style:{flex:1,padding:"10px",fontWeight:600}},l)
      )
    ),
    sub==="users" && e("div",{style:{display:"grid",gap:10}},
      users.map(u=>{
        const s = stats(u.id);
        return e("div",{key:u.id,className:"card",style:{cursor:"pointer"},onClick:()=>openUser(u)},
          e("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center"}},
            e("div",{style:{display:"flex",alignItems:"center",gap:12}},
              e("div",{style:{width:40,height:40,borderRadius:"50%",background:T.faint,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}},u.is_admin?"🛡️":"👤"),
              e("div",{},
                e("div",{style:{fontSize:15,fontWeight:600}},u.display_name," ",u.is_admin&&e("span",{style:{fontSize:10,color:T.accent,background:T.accentGlow,border:`1px solid ${T.accent}`,borderRadius:4,padding:"1px 5px"}},"Admin")),
                e("div",{style:{fontSize:11,color:T.muted}},"HCP "+u.hcp_index+" · "+s.rounds+" Runden"),
                s.last && e("div",{style:{fontSize:10,color:T.muted}},"Zuletzt: "+new Date(s.last).toLocaleDateString("de-DE"))
              )
            ),
            e("div",{style:{textAlign:"right"}},
              e("div",{style:{fontSize:10,color:T.muted}},"⌀ Netto"),
              e("div",{style:{fontFamily:"Georgia,serif",fontSize:24,color:T.accent,fontWeight:700}},s.avg),
              e("div",{style:{fontSize:10,color:T.muted}},"Beste: "+s.best)
            )
          )
        );
      })
    ),
    sub==="rounds" && e("div",{style:{display:"grid",gap:8}},
      allRounds.slice(0,30).map(r=>{
        const p=r.players?.[0]; const t=r.totals?.[p?.id]||{};
        const u=users.find(x=>x.id===r.user_id);
        return e("div",{key:r.id,className:"card"},
          e("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center"}},
            e("div",{},
              e("div",{style:{fontSize:13,fontWeight:600}},r.course_name),
              e("div",{style:{fontSize:11,color:T.accent}},"👤 "+(u?.display_name||"?")),
              e("div",{style:{fontSize:11,color:T.muted}},new Date(r.date).toLocaleDateString("de-DE")+" · "+(r.num_holes||18)+"L")
            ),
            e("div",{style:{textAlign:"right"}},
              e("div",{style:{fontFamily:"Georgia,serif",fontSize:26,color:T.accent,fontWeight:700,lineHeight:1}},t.nettoStableford||0),
              e("div",{style:{fontSize:10,color:T.muted}},"Brutto: "+(t.bruttoScore||0))
            )
          )
        );
      }),
      allRounds.length>30 && e("div",{style:{textAlign:"center",fontSize:12,color:T.muted,padding:8}},"... und "+(allRounds.length-30)+" weitere Runden")
    )
  );
}

// ══════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════
function startApp() {
  const container = document.getElementById("root");
  if (!container) { setTimeout(startApp, 50); return; }
  try {
    const root = ReactDOM.createRoot(container);
    root.render(React.createElement(App));
  } catch(ex) {
    container.innerHTML = '<div style="padding:30px;color:#f87171;background:#060e08;min-height:100vh">' +
      '<div style="font-size:40px">⛳</div><p>Start-Fehler: '+ex.message+'</p></div>';
  }
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', startApp);
} else {
  startApp();
}
</script>
</body>
</html>
